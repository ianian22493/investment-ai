    if(s==='起手區') return '<span style="background:#C9A84C;color:#1a1a1a;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700">🎯 起手區</span>';
    if(s==='接近')  return '<span style="color:#C9A84C;font-size:11px;font-weight:600">接近</span>';
    return '<span style="color:var(--text3,#8a8a8a);font-size:11px">還遠</span>';
  };
  const revColor = {confirm:'var(--text3,#8a8a8a)', warn:'#C0392B', caution:'var(--text3,#8a8a8a)', neutral:'var(--text3,#8a8a8a)'};
  const revTail = {confirm:'', warn:' ← 論述亮紅燈', caution:'', neutral:''};
  const prioBadge = z => {
    const p = z.priority;
    if(!p) return '';
    // 彩券只給明確標記的 Stage-0 題材股(z.tier)；否則照排名分主菜/時機/配菜(尾端歸配菜、不再自動變彩券)
    const tierName = z.tier ? z.tier : (p<=3?'主菜':p<=6?'時機':'配菜');
    const c='var(--text3,#8a8a8a)';
    return `<span style="display:inline-block;font-size:10px;font-weight:700;color:${c};border:1px solid ${c};border-radius:4px;padding:0 4px;margin-right:5px">#${p} ${tierName}</span>`;
  };
  const rows = zs.map(z=>{
    const hit = z.status==='加碼區' || z.status==='起手區';
    const owned = !!z.held;
    const bg = owned ? 'background:rgba(30,132,73,0.10);border-left:3px solid #1E8449;'
             : hit ? 'background:rgba(201,168,76,0.15);' : '';
    const heldBadge = owned ? `<span style="display:inline-block;font-size:10px;font-weight:700;color:#fff;background:${(z.held.pnl_pct??0)>=0?'#1E8449':'#C0392B'};border-radius:4px;padding:0 5px;margin-left:5px">✅持有 ${z.held.shares}股 ${(z.held.pnl_pct??0)>=0?'+':''}${z.held.pnl_pct??''}%</span>` : '';
    const thinMark = z.thin ? ' <span style="color:#C0392B;font-size:10px">💧薄量</span>' : '';
    const sub = hit ? `<div style="font-size:10.5px;color:var(--text3,#8a8a8a);padding:0 8px 5px;line-height:1.35">🎯 進場區第 ${z.days_in_zone||1} 天 · ${(z.note||'').slice(0,64)}</div>` : '';
    const rev = z.rev ? `<div style="font-size:10.5px;padding:0 8px 5px;line-height:1.3;color:${revColor[z.rev.signal]||revColor.neutral};font-weight:${(z.rev.signal==='warn'||z.rev.signal==='confirm')?600:400}">📈 ${z.rev.brief}${revTail[z.rev.signal]||''}</div>` : '';
    const chipColor = {accumulate:'var(--text3,#8a8a8a)', distribute:'#C0392B', neutral:'var(--text3,#8a8a8a)'};
    const chip = (z.chip && (z.chip.signal==='accumulate'||z.chip.signal==='distribute')) ? `<div style="font-size:10.5px;padding:0 8px 5px;line-height:1.3;color:${chipColor[z.chip.signal]||chipColor.neutral};font-weight:600">💰 聰明錢：${z.chip.brief}</div>` : '';
    const zoneLabel = owned ? `加碼≤${z.add??'—'}（持有中，跌到加碼區才補）` : `起手≤${z.start??'—'} · 加碼≤${z.add??'—'}`;
    return `<div style="margin-top:3px;border-radius:5px;${bg}">
      <div style="display:flex;align-items:center;gap:8px;padding:5px 8px 3px;line-height:1.4">
        <span style="flex:1;font-size:12px">${prioBadge(z)}<b>${z.code}</b> ${z.name}${heldBadge}${thinMark}</span>
        <span style="font-size:12px;${hit?'color:#C9A84C;font-weight:700':''}">現 ${z.px??'—'}</span>
        <span style="font-size:11px;color:var(--text3,#8a8a8a)">${zoneLabel}</span>
        <span style="min-width:60px;text-align:right">${owned?'':badge(z.status)}</span>
      </div>${rev}${chip}${sub}
    </div>`;
  }).join('');
  const anyHit = zs.some(z=>z.status==='加碼區'||z.status==='起手區');
  const asOf = (zs.find(z=>z.rev)||{}).rev; const asOfTxt = asOf&&asOf.month ? ` · 營收截至${asOf.month}` : '';
  const evs = DATA.watchlist_events || [];
  const evLine = evs.length ? `<div style="font-size:11px;color:#C9A84C;margin:3px 0 1px;padding:5px 8px;background:rgba(201,168,76,0.10);border-radius:5px">📅 近期財報/事件 &nbsp;${evs.map(e=>`${(e.date||'').slice(5)} <b>${e.name}</b> ${e.type||''}${e.days_away===0?'（今天）':e.days_away>0?`（還${e.days_away}天）`:'（剛過）'}`).join(' &nbsp;·&nbsp; ')}</div>` : '';
  hero.insertAdjacentHTML('afterend', `
    <div style="max-width:760px;margin:14px auto 0;padding:10px 14px;border:1px solid rgba(201,168,76,${anyHit?0.65:0.35});border-radius:8px;background:rgba(201,168,76,0.05)">
      <div style="font-size:11px;font-weight:800;letter-spacing:1px;color:#C9A84C">⭐ 寶藏觀察名單 · 入場區${anyHit?' &nbsp;—&nbsp; 🎯 有標的到價！':''}</div>
      <div style="font-size:11px;color:var(--text3,#8a8a8a);margin:2px 0 3px">依 <b>#買進優先序</b>排（週檢更新）· <span style="color:#C9A84C;font-weight:700">金＝到價可買</span> · <span style="color:#C0392B;font-weight:700">紅＝警訊</span> · <span style="color:#1E8449;font-weight:700">綠＝持有中</span> · 📈月營收 💰大戶籌碼 · 掛限價分批別市價追${asOfTxt}</div>
      ${evLine}${rows}
    </div>`);
})();

/* 波段 C1 試用期體檢徽章（止血開關）— 副菜別當主力、別默默失血 */
(function renderProbation(){
  const p = DATA.probation;
  if(!p || !p.badge) return;
  const hero = document.querySelector('.hero');
  if(!hero) return;
  const c = p.status==='suspended' ? {bg:'rgba(192,57,43,0.12)',bd:'#C0392B',fg:'#C0392B'}
          : p.status==='active_pass' ? {bg:'rgba(30,132,73,0.10)',bd:'rgba(30,132,73,0.5)',fg:'#1E8449'}
          : {bg:'rgba(138,138,138,0.08)',bd:'rgba(138,138,138,0.35)',fg:'var(--text3,#8a8a8a)'};
  hero.insertAdjacentHTML('afterend', `
    <div style="max-width:760px;margin:10px auto 0;padding:7px 12px;border:1px solid ${c.bd};border-radius:8px;background:${c.bg};font-size:11px;color:${c.fg};line-height:1.4">
      🎲 <b>波段 C1</b> · ${p.badge}<span style="color:var(--text3,#8a8a8a)"> — ${p.reason||''}</span>
    </div>`);
})();

/* 波段全紀錄（不限 C1 上線日）— 讓照紀律做的每一筆都看得到 alpha（含精誠/所羅門） */
(function renderSwingRecord(){
  const r = DATA.swing_record;
  if(!r || !r.trades || !r.trades.length) return;
  const hero = document.querySelector('.hero');
  if(!hero) return;
  const rows = r.trades.slice().reverse().map(t=>{
    const col = t.win ? '#1E8449' : '#C0392B';
    const era = t.era==='new' ? '新C1' : '舊C1';
    const rt = (t.ret>0?'+':'')+t.ret;
    const al = (t.alpha>0?'+':'')+t.alpha;
    return `<div style="display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-top:1px solid rgba(138,138,138,0.15)">
      <span>${t.date.slice(5)} <b>${t.code} ${t.name||''}</b> <span style="color:var(--text3,#8a8a8a);font-size:9px">${era}</span></span>
      <span style="color:${col};font-weight:600;white-space:nowrap">${rt}% <span style="opacity:.7">(α ${al}%)</span></span>
    </div>`;
  }).join('');
  const ma = (r.mean_alpha>0?'+':'')+r.mean_alpha;
  hero.insertAdjacentHTML('afterend', `
    <details style="max-width:760px;margin:8px auto 0;padding:7px 12px;border:1px solid rgba(138,138,138,0.35);border-radius:8px;background:rgba(138,138,138,0.05);font-size:11px">
      <summary style="cursor:pointer;color:var(--text2,#555)">📒 <b>波段全紀錄</b> · ${r.n} 筆結案 · 勝率 ${r.win_rate}% · 平均 alpha ${ma}%<span style="color:var(--text3,#8a8a8a)">（含 8/7 改版前，判對錯用 alpha）</span></summary>
      <div style="margin-top:6px">${rows}</div>
    </details>`);
})();

/* Swing book (波段在倉部位) — 有部位才顯示 */
(function renderSwingBook(){
  const ops = DATA.open_positions;
  if(!ops || !ops.length) return;
  const sec = document.getElementById('swing-sec');
  const box = document.getElementById('swing-book');
  if(!sec || !box) return;
  const maxP = DATA.max_positions || 5;
  const softP = DATA.soft_cap || 3;
  const rows = ops.map(p => {
    const waiting = p.waiting_fill;
    const cur = waiting ? '待觸價'
      : (typeof p.current_return_pct === 'number')
        ? `${p.current_return_pct >= 0 ? '+' : ''}${p.current_return_pct.toFixed(1)}%` : '—';
    const curCls = waiting ? ''
      : (typeof p.current_return_pct === 'number')
        ? (p.current_return_pct >= 0 ? 'up' : 'down') : '';
    return `
    <div class="sb-row">
      <span class="sb-id"><b>${p.stock_code}</b> ${p.stock_name || ''}</span>
      <span class="sb-date">${waiting ? ('進場區 ' + (p.entry_zone||'—')) : (p.date||'').slice(5) + ' 進'}</span>
      <span class="sb-cur ${curCls}">${cur}</span>
      <span class="sb-plan">停損 ${p.stop_loss || '—'} · 目標 ${p.target || '—'} · D+${p.hold_days_actual || 0}</span>
    </div>`;
  }).join('');
  const capNote = ops.length >= softP ? `達基本 ${softP}·雷達高分可加至 ${maxP}` : `基本 ${softP}/上限 ${maxP}`;
  box.innerHTML = `
    <div class="sb-head">📒 波段在倉 ${ops.length} 檔 · ${capNote} — 今日重點是照顧它們</div>
    ${rows}`;
  sec.style.display = 'block';
})();

document.getElementById('why-watching').className = 'prose lead-cap';
document.getElementById('why-watching').innerHTML =
  (f(DATA.why_watching, DATA.context_paragraph) || '—')
    .split('\n').filter(Boolean).map(p => `<p>${p}</p>`).join('') || '<p class="empty-field">—</p>';

/* Triggers */
document.getElementById('trigger-list').innerHTML =
  (DATA.reactivation_triggers||[]).map(t => `
    <div class="trigger-row">
      <span class="tr-arrow">→</span>
      <div class="tr-text">
        <div class="tr-cond">${f(t.cond)}</div>
        ${t.note ? `<div class="tr-note">${t.note}</div>` : ''}
      </div>
    </div>`).join('') || '<p class="empty-field">無條件設定。</p>';

/* Scanner */
const sc = DATA.scanner_top1;
if(sc && (sc.code || sc.name)){
  document.getElementById('sc-code').textContent = f(sc.code);
  document.getElementById('sc-name').textContent = f(sc.name);
  document.getElementById('sc-score').textContent = `score ${f(sc.score)}`;
  document.getElementById('sc-sees').textContent = f(sc.what_scanner_sees, '—');
  document.getElementById('sc-avoid').textContent = f(sc.what_we_dont_like, '—');
} else {
  document.getElementById('scanner-sec').style.display = 'none';
}

/* Micro pick */
const mp = DATA.micro_pick;
if(mp && (mp.text || mp.code || typeof mp === 'string')){
  document.getElementById('micro-sec').style.display = '';
  const body = typeof mp === 'string' ? mp :
    `${mp.code ? `<b>${mp.code} ${mp.name||''}</b> · ` : ''}${mp.text || mp.rationale || ''}`;
  document.getElementById('micro-body').innerHTML = `<p>${body}</p>`;
}

if(DATA.prev_date) document.getElementById('prev-pick').href = DATA.prev_date + '.html';
else document.getElementById('prev-pick').style.opacity = '.35';
if(DATA.next_date) document.getElementById('next-pick').href = DATA.next_date + '.html';
else document.getElementById('next-pick').style.opacity = '.35';

if(window.applyGlossary) window.applyGlossary();
</script>
<script src="glossary.js"></script>

</body>
</html>
