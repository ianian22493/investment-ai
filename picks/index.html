<head>

<style>
/* ═══ INDEX-SPECIFIC ═══════════════════════════════════════════ */
.index-head{
  padding:32px 0 22px; border-bottom:1px solid var(--line); margin-bottom:22px;
}
.index-title{font-size:clamp(30px,7vw,42px); font-weight:900; letter-spacing:-.5px; color:var(--ink); margin-bottom:8px}
.index-sub{font-size:15px; color:var(--ink2)}

/* control bar */
.ctrl-bar{
  display:flex; align-items:center; justify-content:space-between;
  gap:14px; margin-bottom:20px; flex-wrap:wrap;
}
.month-nav{display:flex; align-items:center; gap:14px}
.month-nav button{
  font-family:var(--mono); font-size:18px;
  width:34px; height:34px; border-radius:50%;
  border:1px solid var(--line2); background:var(--paper2); color:var(--ink);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  transition:border-color .15s, background .15s;
}
.month-nav button:hover{border-color:var(--gold); color:var(--gold)}
.month-nav .month-label{font-family:var(--mono); font-size:15px; letter-spacing:1px; font-weight:600; min-width:130px; text-align:center}

.view-toggle{display:inline-flex; background:var(--paper3); border-radius:22px; padding:3px; border:1px solid var(--line)}
.view-toggle button{
  font-family:var(--mono); font-size:11px; letter-spacing:1.5px; font-weight:600;
  padding:7px 16px; border-radius:18px; border:none; background:none; color:var(--ink2);
  cursor:pointer; transition:background .18s, color .18s;
}
.view-toggle button.active{background:var(--paper2); color:var(--gold); box-shadow:var(--shadow-card)}

/* legend */
.legend{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:18px; font-family:var(--mono); font-size:11px; color:var(--ink2)}
.legend span{display:inline-flex; align-items:center; gap:7px}
.legend .ld{width:9px; height:9px; border-radius:50%}
.ld.win{background:var(--target)}
.ld.loss{background:var(--stop)}
.ld.watch{background:var(--ink3)}
.ld.none{background:transparent; border:1px solid var(--line2)}

/* ═══ CALENDAR ═══ */
.cal{
  display:grid; grid-template-columns:repeat(7, 1fr);
  gap:6px;
}
.cal-wd{
  font-family:var(--mono); font-size:10.5px; letter-spacing:1.5px;
  color:var(--ink3); text-align:center; padding:6px 0;
}
.cal-cell{
  aspect-ratio:1/1;
  background:var(--paper2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:7px 8px;
  position:relative;
  display:flex; flex-direction:column;
  cursor:default;
  transition:transform .14s, box-shadow .14s, border-color .14s;
  text-decoration:none; color:inherit;
}
.cal-cell.empty{background:transparent; border-color:transparent}
.cal-cell.has{cursor:pointer}
.cal-cell.has:hover{transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--gold)}
.cal-day{font-family:var(--mono); font-size:12px; color:var(--ink2); font-weight:600}
.cal-cell.today .cal-day{color:var(--gold)}
.cal-cell.today{border-color:var(--gold)}
.cal-dot{
  position:absolute; right:8px; top:8px;
  width:9px; height:9px; border-radius:50%;
}
.cal-dot.win{background:var(--target); box-shadow:0 0 0 3px var(--target-soft)}
.cal-dot.loss{background:var(--stop); box-shadow:0 0 0 3px var(--stop-soft)}
.cal-dot.watch{background:var(--ink3)}
.cal-result{
  margin-top:auto;
  font-family:var(--mono); font-size:11px; font-weight:700;
}
.cal-result.win{color:var(--target)}
.cal-result.loss{color:var(--stop)}
.cal-code{font-family:var(--mono); font-size:10px; color:var(--ink3); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cal-entry{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.3px;
  color:var(--gold); font-weight:600; margin-top:2px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.cal-toggle{
  position:absolute; right:6px; bottom:6px;
  width:22px; height:22px; border-radius:5px;
  background:var(--paper); border:1px solid var(--line2);
  font-family:var(--mono); font-size:13px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; padding:0;
  transition:background .12s, border-color .12s, color .12s;
}
.cal-toggle.unset{color:var(--ink3)}
.cal-toggle.done{color:var(--target); border-color:var(--target); background:var(--target-soft)}
.cal-toggle.skipped{color:var(--stop); border-color:var(--stop); background:var(--stop-soft)}
.cal-toggle:hover{transform:scale(1.08); border-color:var(--gold)}

/* hover tooltip */
.cal-tip{
  position:fixed; z-index:60;
  background:var(--navy); color:#DDE5F5;
  font-family:var(--mono); font-size:11px; letter-spacing:.5px;
  padding:8px 11px; border-radius:8px;
  box-shadow:0 8px 28px rgba(0,0,0,.3);
  pointer-events:none; opacity:0; transform:translateY(4px);
  transition:opacity .15s, transform .15s;
  white-space:nowrap;
  border:1px solid rgba(201,168,76,.3);
}
.cal-tip.show{opacity:1; transform:translateY(0)}
.cal-tip .tip-res{font-weight:700}
.cal-tip .tip-res.win{color:#5FCf9b}
.cal-tip .tip-res.loss{color:#FF7A84}
.cal-tip .tip-res.watch{color:#9AA8C8}

/* ═══ LIST VIEW ═══ */
.list-view{display:none}
.list-view.active{display:block}
.cal.hidden{display:none}

.list-filters{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap}
.filter-pill{
  font-family:var(--mono); font-size:11px; letter-spacing:1px;
  padding:6px 14px; border-radius:20px;
  border:1px solid var(--line2); background:var(--paper2); color:var(--ink2);
  cursor:pointer; transition:all .15s;
}
.filter-pill.active{border-color:var(--gold); color:var(--gold); background:var(--gold-soft)}

.pick-table{width:100%; border-collapse:collapse; font-size:14px}
.pick-table thead th{
  font-family:var(--mono); font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase;
  color:var(--ink3); text-align:left; padding:10px 12px; border-bottom:2px solid var(--line2); font-weight:600;
}
.pick-table tbody tr{
  border-bottom:1px solid var(--line); cursor:pointer; transition:background .14s;
}
.pick-table tbody tr:hover{background:var(--paper2)}
.pick-table td{padding:13px 12px; vertical-align:middle}
.pt-date{font-family:var(--mono); font-size:12.5px; color:var(--ink2); white-space:nowrap}
.pt-stock b{font-size:15px; color:var(--ink)}
.pt-stock .pt-code{font-family:var(--mono); font-size:12px; color:var(--ink3); margin-right:6px}
.pt-verdict{font-family:var(--serif); font-weight:800}
.pt-verdict.attack{color:var(--gold)}
.pt-verdict.watch{color:var(--ink3)}
.pt-result{font-family:var(--mono); font-weight:700; text-align:right; white-space:nowrap}
.pt-result.win{color:var(--target)}
.pt-result.loss{color:var(--stop)}
.pt-result.pending{color:var(--ink3)}
.pt-result.watch{color:var(--ink3)}

.list-empty{text-align:center; padding:50px 20px; color:var(--ink3); font-style:italic}

/* range toggle */
.range-toggle{
  display:flex; gap:6px; margin-bottom:12px; justify-content:center;
}
.range-toggle button{
  font-family:var(--mono); font-size:11px; letter-spacing:1px;
  padding:6px 14px; background:transparent; color:var(--ink3);
  border:1px solid var(--line); border-radius:20px; cursor:pointer;
  transition:all .15s ease;
}
.range-toggle button:hover{color:var(--ink2); border-color:var(--gold-dim)}
.range-toggle button.active{
  background:var(--gold); color:var(--paper); border-color:var(--gold);
  font-weight:700;
}

/* summary stats */
.stat-strip{
  display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:22px;
}
.stat .s-sub{font-family:var(--mono); font-size:10px; color:var(--ink3); margin-top:2px}
.stat{
  background:var(--paper2); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:14px 16px; text-align:center;
}
.stat .s-val{font-family:var(--mono); font-size:24px; font-weight:700; color:var(--ink)}
.stat .s-val.win{color:var(--target)}
.stat .s-lbl{font-family:var(--mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink3); margin-top:5px}

@media (max-width:640px){
  .stat-strip{grid-template-columns:repeat(2,1fr)}
  .cal{gap:4px}
  .cal-cell{padding:5px 6px; border-radius:8px}
  .cal-result, .cal-code, .cal-entry{display:none}  /* compact: dot + toggle only on mobile */
  .cal-dot{position:static; margin-top:auto; align-self:flex-start}
  .cal-toggle{width:18px; height:18px; font-size:11px; right:4px; bottom:4px}
  .pick-table td{padding:11px 8px}
  .pt-stock .pt-code{display:block; margin:0 0 2px}
}
</style>
</head>

<script>
/* PICKS INDEX DATA — only used as fallback when picks-data is unreplaced
   (i.e. opening this template directly without running generate.py). */
const SAMPLE_PICKS = [
  { date:"2026-06-19", type:"pick",  code:"2492", name:"華新科", verdict:"推薦出手", result:"pending", pnl:null }
];

let PICKS;
try {
  const raw = (document.getElementById('picks-data').textContent || '').trim();
  PICKS = (raw && !raw.startsWith('{{')) ? JSON.parse(raw) : SAMPLE_PICKS;
} catch(e){ PICKS = SAMPLE_PICKS; }

const byDate = {};
PICKS.forEach(p => byDate[p.date] = p);

/* STATS DATA — 全部已結案 picks（含歷史，不限於有 HTML 頁的日期），
   供 range toggle 的統計面板使用。fetch 失敗時退回 PICKS. */
let STATS_PICKS = null;
fetch('stats.json?t=' + Date.now(), {cache:'no-store'})
  .then(r => r.json())
  .then(d => {
    STATS_PICKS = (d.picks || []).map(p => ({
      date: p.date,
      code: p.stock_code,
      name: p.stock_name,
      type: 'pick',
      result: p.success === 1 ? 'win' : (p.success === 0 ? 'loss' : 'pending'),
      pnl: p.return_pct != null ? (p.return_pct >= 0 ? '+' : '') + p.return_pct.toFixed(1) + '%' : null,
      return_pct: p.return_pct,
      benchmark_return_pct: p.benchmark_return_pct,
      alpha_pct: p.alpha_pct,
    }));
    if(typeof renderStats === 'function') renderStats();
  })
  .catch(() => {});

/* current view month — start at most recent pick's month */
let viewYear, viewMonth;
(function initMonth(){
  const latest = PICKS.map(p=>p.date).sort().pop() || '2026-06-01';
  const d = new Date(latest + 'T00:00:00');
  viewYear = d.getFullYear(); viewMonth = d.getMonth();
})();

const todayISO = new Date().toISOString().slice(0,10);
const WD = ['日','一','二','三','四','五','六'];

/* ─── Calendar render ─── */
/* ─── localStorage 'yuzu-pick-actioned' — SAME key + schema as dashboard
 *      ARCHIVE so toggling here syncs with PICK HISTORY there.
 *      Schema v2: { [pickId]: { state: 'followed'|'skipped', entry: number|null } }
 *      pickId = `${date}|${code}` */
const ACTIONED_KEY = 'yuzu-pick-actioned';
function escapeHTML(s){
  if(s==null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function pickId(iso, code){ return `${iso}|${code||''}`; }
function getActionedMap(){
  try { return JSON.parse(localStorage.getItem(ACTIONED_KEY) || '{}'); }
  catch { return {}; }
}
function getActionedState(id){
  const e = getActionedMap()[id];
  if(!e) return null;
  return (typeof e === 'string') ? e : (e.state || null);
}
function cycleActionedState(id){
  const cur = getActionedState(id);
  const next = cur === null ? 'followed' : cur === 'followed' ? 'skipped' : null;
  const map = getActionedMap();
  const existing = (typeof map[id] === 'object' && map[id]) ? map[id] : {};
  if(next) map[id] = { state: next, entry: existing.entry || null };
  else delete map[id];
  try { localStorage.setItem(ACTIONED_KEY, JSON.stringify(map)); } catch {}
  return next;
}

function renderCalendar(){
  document.getElementById('monthLabel').textContent = `${viewYear} · ${String(viewMonth+1).padStart(2,'0')}`;
  const cal = document.getElementById('calendar');
  cal.innerHTML = WD.map(w => `<div class="cal-wd">${w}</div>`).join('');

  const first = new Date(viewYear, viewMonth, 1);
  const startPad = first.getDay();
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();

  for(let i=0; i<startPad; i++){
    cal.insertAdjacentHTML('beforeend', '<div class="cal-cell empty"></div>');
  }
  for(let day=1; day<=daysInMonth; day++){
    const iso = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const p = byDate[iso];
    const isToday = iso === todayISO;
    if(!p){
      cal.insertAdjacentHTML('beforeend',
        `<div class="cal-cell ${isToday?'today':''}"><span class="cal-day">${day}</span></div>`);
      continue;
    }
    let dotClass = 'watch', resHTML = '';
    if(p.type === 'watch'){ dotClass = 'watch'; }
    else if(p.result === 'win'){ dotClass='win'; resHTML = `<div class="cal-result win">${escapeHTML(p.pnl||'WIN')}</div>`; }
    else if(p.result === 'loss'){ dotClass='loss'; resHTML = `<div class="cal-result loss">${escapeHTML(p.pnl||'LOSS')}</div>`; }
    else if(p.result === 'not_filled'){ dotClass='watch'; resHTML = `<div class="cal-result" style="color:var(--ink3)">未成交</div>`; }
    else { dotClass='watch'; resHTML = `<div class="cal-result" style="color:var(--ink3)">…</div>`; }

    const codeLine = p.code ? `<div class="cal-code">${escapeHTML(p.code)}</div>` : '<div class="cal-code">觀望</div>';
    const entryLine = (p.type === 'pick' && p.entry_zone)
      ? `<div class="cal-entry">${escapeHTML(p.entry_zone)}</div>` : '';

    // "我做了嗎" toggle — only on pick days. State syncs with dashboard ARCHIVE.
    let toggleHTML = '';
    if(p.type === 'pick' && p.code){
      const pid = pickId(iso, p.code);
      const st  = getActionedState(pid);
      const sym = st === 'followed' ? '✓' : st === 'skipped' ? '✗' : '☐';
      const cls = st === 'followed' ? 'done' : st === 'skipped' ? 'skipped' : 'unset';
      const ttl = st === 'followed' ? '已照做 (點擊改為 沒做)'
                : st === 'skipped'  ? '沒做 (點擊清除)'
                :                     '未標記 (點擊：我做了)';
      toggleHTML = `<button class="cal-toggle ${cls}" data-pid="${escapeHTML(pid)}" title="${ttl}" aria-label="${ttl}">${sym}</button>`;
    }

    cal.insertAdjacentHTML('beforeend', `
      <a class="cal-cell has ${isToday?'today':''}" href="${iso}.html"
         data-iso="${iso}" data-name="${escapeHTML(p.name||'觀望')}" data-code="${escapeHTML(p.code||'')}"
         data-res="${p.result||(p.type==='watch'?'watch':'pending')}" data-pnl="${escapeHTML(p.pnl||'')}">
        <span class="cal-day">${day}</span>
        <span class="cal-dot ${dotClass}"></span>
        ${codeLine}${entryLine}${resHTML}${toggleHTML}
      </a>`);
  }
  wireTips();
}

// Event delegation: clicking the toggle button cycles state without
// navigating to the pick page (preventDefault on parent <a>).
document.getElementById('calendar').addEventListener('click', e => {
  const btn = e.target.closest('.cal-toggle');
  if(!btn) return;
  e.preventDefault();
  e.stopPropagation();
  cycleActionedState(btn.dataset.pid);
  renderCalendar();   // re-render to update the toggle visual
});

/* ─── Hover tooltips ─── */
const tip = document.getElementById('calTip');
function wireTips(){
  document.querySelectorAll('.cal-cell.has').forEach(cell => {
    cell.addEventListener('pointerenter', e => {
      const name = cell.dataset.name, code = cell.dataset.code;
      const res = cell.dataset.res, pnl = cell.dataset.pnl;
      let resTxt = '觀望', resCls = 'watch';
      if(res === 'win'){ resTxt = pnl || '獲利'; resCls='win'; }
      else if(res === 'loss'){ resTxt = pnl || '停損'; resCls='loss'; }
      else if(res === 'pending'){ resTxt = '進行中'; resCls='watch'; }
      else if(res === 'not_filled'){ resTxt = '未成交'; resCls='watch'; }
      tip.innerHTML = code
        ? `${code} ${name} · <span class="tip-res ${resCls}">${resTxt}</span>`
        : `<span class="tip-res watch">今日觀望</span>`;
      const r = cell.getBoundingClientRect();
      tip.style.left = Math.min(r.left, window.innerWidth - 180) + 'px';
      tip.style.top = (r.top - 40) + 'px';
      tip.classList.add('show');
    });
    cell.addEventListener('pointerleave', () => tip.classList.remove('show'));
  });
}

/* ─── List render ─── */
let listFilter = 'all';
function renderList(){
  const body = document.getElementById('listBody');
  const rows = PICKS
    .slice().sort((a,b) => b.date.localeCompare(a.date))
    .filter(p => {
      if(listFilter === 'all') return true;
      if(listFilter === 'watch') return p.type === 'watch';
      return p.result === listFilter;
    });
  document.getElementById('listEmpty').style.display = rows.length ? 'none' : 'block';
  body.innerHTML = rows.map(p => {
    const d = new Date(p.date+'T00:00:00');
    const dateStr = `${p.date.slice(5).replace('-','/')} 週${WD[d.getDay()]}`;
    let resCls = 'watch', resTxt = '—';
    if(p.type==='watch'){ resTxt='觀望'; resCls='watch'; }
    else if(p.result==='win'){ resTxt=p.pnl||'獲利'; resCls='win'; }
    else if(p.result==='loss'){ resTxt=p.pnl||'停損'; resCls='loss'; }
    else { resTxt='進行中'; resCls='pending'; }
    const stock = p.code
      ? `<span class="pt-code">${p.code}</span><b>${p.name}</b>`
      : `<span style="color:var(--ink3)">—</span>`;
    const vCls = p.type==='watch' ? 'watch' : 'attack';
    return `<tr onclick="location.href='${p.date}.html'">
      <td class="pt-date">${dateStr}</td>
      <td class="pt-stock">${stock}</td>
      <td><span class="pt-verdict ${vCls}">${p.verdict||'—'}</span></td>
      <td class="pt-result ${resCls}">${resTxt}</td>
    </tr>`;
  }).join('');
}

/* ─── Stats ─── */
let statsRange = '30';   // '7' | '30' | 'all'
function _picksInRange(source){
  const arr = source || PICKS;
  if(statsRange === 'all') return arr;
  const days = parseInt(statsRange, 10);
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
  const iso = cutoff.toISOString().slice(0,10);
  return arr.filter(p => p.date >= iso);
}
function _pnlValue(pnl){
  // "+6.1%" → 6.1, "-3.8%" → -3.8, null → null
  if(!pnl) return null;
  const m = pnl.match(/([+-]?\d+(?:\.\d+)?)/);
  return m ? parseFloat(m[1]) : null;
}
function renderStats(){
  // Watch days come from manifest (PICKS); pick metrics come from stats.json
  // (STATS_PICKS) which includes full DB history not just files.
  const manifestScope = _picksInRange(PICKS);
  const dbSource = STATS_PICKS || PICKS.filter(p => p.type === 'pick');
  const scope = _picksInRange(dbSource);
  const picks = scope.filter(p => p.type === 'pick');
  const settled = picks.filter(p => p.result === 'win' || p.result === 'loss');
  const wins = settled.filter(p => p.result === 'win');
  const winRate = settled.length ? Math.round(wins.length/settled.length*100) : null;
  const watches = manifestScope.filter(p => p.type === 'watch').length;
  // Average P&L across settled trades (both wins and losses)
  const pnls = settled.map(p => _pnlValue(p.pnl)).filter(v => v !== null);
  const avgPnl = pnls.length ? (pnls.reduce((a,b)=>a+b,0) / pnls.length) : null;
  // Average alpha vs 0050
  const alphas = settled.map(p => (p.alpha_pct != null ? p.alpha_pct : null)).filter(v => v !== null);
  const avgAlpha = alphas.length ? (alphas.reduce((a,b)=>a+b,0) / alphas.length) : null;
  const winAlpha = alphas.filter(a => a > 0).length;
  // Format helpers
  const winRateHtml = winRate === null
    ? `<div class="s-val" style="color:var(--ink3)">—</div>`
    : `<div class="s-val ${winRate >= 50 ? 'win':''}">${winRate}%</div>`;
  const avgPnlHtml = avgPnl === null
    ? `<div class="s-val" style="color:var(--ink3)">—</div>`
    : `<div class="s-val" style="color:${avgPnl >= 0 ? 'var(--target)':'var(--stop)'}">${avgPnl >= 0 ? '+':''}${avgPnl.toFixed(1)}%</div>`;
  const avgAlphaHtml = avgAlpha === null
    ? `<div class="s-val" style="color:var(--ink3)">—</div>`
    : `<div class="s-val" style="color:${avgAlpha >= 0 ? 'var(--target)':'var(--stop)'}">${avgAlpha >= 0 ? '+':''}${avgAlpha.toFixed(1)}%</div>`;
  const winCount = `${wins.length}W / ${settled.length - wins.length}L`;
  const rangeLbl = statsRange === 'all' ? '全部' : `近 ${statsRange} 天`;
  document.getElementById('stat-strip').innerHTML = `
    <div class="stat" data-tip="${rangeLbl}內系統推薦出手 ${picks.length} 次，觀望 ${watches} 天">
      <div class="s-val">${picks.length}</div>
      <div class="s-lbl">出手次數</div>
      <div class="s-sub">觀望 ${watches} 天</div>
    </div>
    <div class="stat" data-tip="已結案 pick 中賺錢的比例">
      ${winRateHtml}
      <div class="s-lbl">勝率</div>
      <div class="s-sub">${settled.length ? winCount : '無已結案'}</div>
    </div>
    <div class="stat" data-tip="已結案 pick 的平均損益百分比（贏跟輸都算進去）">
      ${avgPnlHtml}
      <div class="s-lbl">平均損益</div>
    </div>
    <div class="stat" data-tip="pick 報酬減去同期 0050 大盤報酬。正 = 系統選股打贏躺著不動買 ETF。">
      ${avgAlphaHtml}
      <div class="s-lbl">Alpha vs 大盤</div>
      <div class="s-sub">${alphas.length ? `${winAlpha} 筆勝過大盤` : '無資料'}</div>
    </div>`;
  if(window.applyGlossary) window.applyGlossary(document.getElementById('stat-strip'));
}
/* Range toggle wiring */
document.querySelectorAll('#rangeToggle button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#rangeToggle button').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    statsRange = btn.dataset.range;
    renderStats();
  };
});

/* ─── Wiring ─── */
document.getElementById('prevMonth').onclick = () => { viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;} renderCalendar(); };
document.getElementById('nextMonth').onclick = () => { viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;} renderCalendar(); };

document.getElementById('vCal').onclick = () => {
  document.getElementById('vCal').classList.add('active');
  document.getElementById('vList').classList.remove('active');
  document.getElementById('calendar').classList.remove('hidden');
  document.querySelector('.ctrl-bar .month-nav').style.visibility = 'visible';
  document.querySelector('.legend').style.display = 'flex';
  document.getElementById('listView').classList.remove('active');
};
document.getElementById('vList').onclick = () => {
  document.getElementById('vList').classList.add('active');
  document.getElementById('vCal').classList.remove('active');
  document.getElementById('calendar').classList.add('hidden');
  document.querySelector('.ctrl-bar .month-nav').style.visibility = 'hidden';
  document.querySelector('.legend').style.display = 'none';
  document.getElementById('listView').classList.add('active');
  renderList();
};
document.querySelectorAll('.filter-pill').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.filter-pill').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    listFilter = b.dataset.filter;
    renderList();
  };
});

renderStats();
renderCalendar();
</script>
