<script id="pick-data" type="application/json">{"date": "2026-07-08", "regime": "資金輪動", "risk_level": "moderate", "verdict": "空手觀望", "context_paragraph": "今日台股呈現資金輪動格局，大盤雖收平盤，但高價股面臨劇烈獲利了結賣壓，導致主流族群顯著轉弱。外資單日大幅賣超逾 255 億元，顯示資金外流壓力。儘管全球主要指數處於歷史高位，美股科技板塊表現亦不俗，但台股內部結構動盪，VIX 指數有回升跡象，市場不確定性增加，需保持高度警惕與耐心。", "why_watching": "「耐心並非無所事事，而是在等待一個更具吸引力的價格與更清晰的市場結構。」今日系統決定空手觀望，主要基於以下幾點考量：\n\n首先，市場籌碼結構顯著惡化。外資單日大幅賣超逾 255 億元 (foreign_flow_strength 0.245)，顯示資金正從台股流出。同時，高價股面臨嚴峻的獲利了結賣壓，導致過往主流族群明顯轉弱，市場缺乏強而有力的領漲板塊支持。\n\n其次，大盤整體風險因子偏高。儘管指數表面持平，但市場內部結構動盪劇烈，VIX 指數回升至 15.57，反映出市場對未來波動的擔憂情緒升溫。美股科技股的承壓也為台股帶來不確定性，在當前市場普遍存在樂觀情緒與盲點的背景下，系統認為此刻並非進場的理想時機。\n\n再者，市場廣度不足。儘管上漲家數略多於下跌家數 (534/431)，但綜合 breadth_score 0.553 指標顯示，資金僅在特定小型族群間輪動，並未形成有效且全面的上攻動能。這種缺乏共識的輪動，使得擇股難度與風險同步升高。\n\n最後，在當前充滿不確定性且高估值風險仍需警惕的環境下，短線交易的勝率及風險報酬比均不具吸引力。市場對於高估值 AI 題材的普遍樂觀，反而增加了潛在的下行風險。此刻，系統選擇耐心等待，而非盲目追逐風險。", "reactivation_triggers": [{"cond": "外資連續 2 日買超", "note": "且單日金額 > 50 億新台幣"}, {"cond": "VIX 指數回落至 14 以下", "note": "且美股主要指數趨穩"}, {"cond": "台股大盤突破前高並站穩 3 日", "note": "且成交量能有效放大"}, {"cond": "Breadth Score 提升至 0.75 以上", "note": "顯示資金廣泛回流市場，非僅局部輪動"}, {"cond": "主流族群出現明確止穩訊號", "note": "且有新領漲族群浮現，而非單一個股表現"}], "scanner_top1": {"code": "1717", "name": "長興", "score": 6, "what_scanner_sees": "長興 (1717) 在 Scanner 雷達上表現突出，其技術面訊號極為強勁。股價位居均線之上 (above_ma20)，且均線呈現多頭排列 (ma_aligned)，顯示明確的上漲趨勢。近期更出現放量突破 (vol_surge) 並創五日新高 (five_day_high)，搭配 RSI 動能穩健 (rsi_zone) 與相對強度訊號 (rs_signal)，顯示其具備短線爆發潛力與市場關注度。", "what_we_dont_like": "儘管長興展現強勁動能，但考量到目前市場整體結構的脆弱性，系統仍選擇不介入。當前大盤外資賣壓沉重，主流族群轉弱，即便個股再強勢，其上漲的持續性與潛在風險報酬比仍有疑慮。在市場風險偏好降低、資金廣度不足的背景下，單一個股的強勢難以抵禦系統性壓力，其位階與短期波動風險也相對較高。"}, "micro_pick": null, "prev_date": "2026-07-07", "next_date": null}</script>

<script>
const SAMPLE = {
  date: "2026-06-17",
  regime: "震盪整理",
  risk_level: "中高",
  verdict: "空手觀望",
  context_paragraph: "今日加權指數開高走低，終場小跌，量能萎縮至近月低點。外資轉為小幅賣超，市場觀望氣氛濃厚，等待週四美國 CPI 數據。",
  why_watching: "今天系統選擇空手，原因有三：第一，量能不足——加權指數成交量只有月均量的 78%，在這種「無量盤」裡突破容易是假動作。第二，最強候選股的風險報酬比不夠乾淨，現在進場等於用 8 分的把握賺 6 分的空間，不划算。第三，週四有 CPI 數據，與其在數據前猜方向，不如等塵埃落定再出手。耐心不是沒事做，是在等一個更好的價格。",
  reactivation_triggers: [
    { cond: "外資連續 2 日買超", note: "且單日金額 > 50 億，代表資金回流" },
    { cond: "加權指數帶量站回月線", note: "成交量需 > 月均量 1.1x" },
    { cond: "CPI 數據公布後波動收斂", note: "VIX 回落至 18 以下" },
    { cond: "出現 ≥ 2 檔 scanner_score ≥ 7 的候選", note: "目前最高僅 5 分" }
  ],
  scanner_top1: {
    code: "3017", name: "奇鋐", score: 5,
    what_scanner_sees: "散熱題材龍頭，近期帶量突破前高，外資連 3 日小幅買超，技術面與題材面都站在多方。",
    what_we_dont_like: "已經連漲 5 天，短線乖離過大，現在追等於買在情緒高點。風險報酬比只有 1.8，低於系統 2.5 的門檻。寧可等它回測均線再說。"
  },
  micro_pick: null
};

let DATA;
try {
  const raw = document.getElementById('pick-data').textContent.trim();
  DATA = (raw && !raw.startsWith('{{')) ? JSON.parse(raw) : SAMPLE;
} catch(e){ DATA = SAMPLE; }

const f = (v, dflt='—') => (v === undefined || v === null || v === '') ? dflt : v;
const WD = ['日','一','二','三','四','五','六'];
function fmtDate(iso){
  if(!iso) return {full:'—', wd:'', mono:'—'};
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return {full:iso, wd:'', mono:iso};
  return {
    full: `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`,
    wd: `星期${WD[d.getDay()]}`,
    mono: iso.replace(/-/g,' · ')
  };
}

const dt = fmtDate(DATA.date);
document.getElementById('rb-date').textContent = dt.mono;
document.getElementById('hero-date').innerHTML = `<span>${dt.full}</span><span class="weekday">${dt.wd}</span>`;
document.getElementById('hero-verdict').textContent = f(DATA.verdict, '今日觀望');
document.getElementById('hero-sub').innerHTML =
  `今天系統選擇<span class="accent"> 不出手</span>。耐心也是一種部位。` + `
  <span class="hero-chiprow" style="margin-top:14px">
    <span class="chip regime"><span class="dot"></span>REGIME · ${f(DATA.regime)}</span>
    <span class="chip risk"><span class="dot"></span>風險 · ${f(DATA.risk_level)}</span>
  </span>`;

document.getElementById('why-watching').className = 'prose lead-cap';
document.getElementById('why-watching').innerHTML =
  (f(DATA.why_watching, DATA.context_paragraph) || '—')
    .split('\n').filter(Boolean).map(p => `<p>${p}</p>`).join('') || '<p class="empty-field">—</p>';

/* Triggers */
document.getElementById('trigger-list').innerHTML =
  (DATA.reactivation_triggers||[]).map(t => `
    <div class="trigger-row">
      <span class="tr-arrow">→</span>
      <div class="tr-text">
        <div class="tr-cond">${f(t.cond)}</div>
        ${t.note ? `<div class="tr-note">${t.note}</div>` : ''}
      </div>
    </div>`).join('') || '<p class="empty-field">無條件設定。</p>';

/* Scanner */
const sc = DATA.scanner_top1;
if(sc && (sc.code || sc.name)){
  document.getElementById('sc-code').textContent = f(sc.code);
  document.getElementById('sc-name').textContent = f(sc.name);
  document.getElementById('sc-score').textContent = `score ${f(sc.score)}`;
  document.getElementById('sc-sees').textContent = f(sc.what_scanner_sees, '—');
  document.getElementById('sc-avoid').textContent = f(sc.what_we_dont_like, '—');
} else {
  document.getElementById('scanner-sec').style.display = 'none';
}

/* Micro pick */
const mp = DATA.micro_pick;
if(mp && (mp.text || mp.code || typeof mp === 'string')){
  document.getElementById('micro-sec').style.display = '';
  const body = typeof mp === 'string' ? mp :
    `${mp.code ? `<b>${mp.code} ${mp.name||''}</b> · ` : ''}${mp.text || mp.rationale || ''}`;
  document.getElementById('micro-body').innerHTML = `<p>${body}</p>`;
}

if(DATA.prev_date) document.getElementById('prev-pick').href = DATA.prev_date + '.html';
else document.getElementById('prev-pick').style.opacity = '.35';
if(DATA.next_date) document.getElementById('next-pick').href = DATA.next_date + '.html';
else document.getElementById('next-pick').style.opacity = '.35';

if(window.applyGlossary) window.applyGlossary();
</script>
