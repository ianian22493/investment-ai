  <!-- 3 · REACTIVATION TRIGGERS -->
  <section class="sec">

  <!-- 4 · SCANNER TOP1 -->
  <section class="sec" id="scanner-sec">
    <div class="sec-label"><span class="sec-no">03</span> 雷達最強標的 · SCANNER</div>
    <p class="prose" style="font-size:14.5px; color:var(--ink2); margin-bottom:16px">
      雖然今天不出手，但系統雷達上分數最高的是這檔 —— 以及為什麼我們還是按兵不動。
    </p>
    <div class="scanner-card">
      <div class="scanner-top">
        <span class="scanner-code" id="sc-code">—</span>
        <span class="scanner-name" id="sc-name">—</span>
        <span class="scanner-score" id="sc-score">score —</span>
      </div>
      <div class="scanner-split">
        <div class="scanner-col sees">
          <div class="sc-h">▲ 雷達看到什麼</div>
          <p id="sc-sees"></p>
        </div>
        <div class="scanner-col avoid">
          <div class="sc-h">▼ 但我們不喜歡</div>
          <p id="sc-avoid"></p>
        </div>
      </div>

  <section class="sec" id="micro-sec" style="display:none">
    <div class="sec-label"><span class="sec-no">04</span> 試單建議 · MICRO PICK</div>
    <div class="micro-pick">
      <div class="mp-tag">⚐ 小量試單（非正式進場）</div>
      <div class="prose" id="micro-body"></div>
    </div>
  </section>

<script>
const SAMPLE = {
  date: "2026-06-17",
  regime: "震盪整理",
  risk_level: "中高",
  verdict: "空手觀望",
  context_paragraph: "今日加權指數開高走低，終場小跌，量能萎縮至近月低點。外資轉為小幅賣超，市場觀望氣氛濃厚，等待週四美國 CPI 數據。",
  why_watching: "今天系統選擇空手，原因有三：第一，量能不足——加權指數成交量只有月均量的 78%，在這種「無量盤」裡突破容易是假動作。第二，最強候選股的風險報酬比不夠乾淨，現在進場等於用 8 分的把握賺 6 分的空間，不划算。第三，週四有 CPI 數據，與其在數據前猜方向，不如等塵埃落定再出手。耐心不是沒事做，是在等一個更好的價格。",
  reactivation_triggers: [
    { cond: "外資連續 2 日買超", note: "且單日金額 > 50 億，代表資金回流" },
    { cond: "加權指數帶量站回月線", note: "成交量需 > 月均量 1.1x" },
    { cond: "CPI 數據公布後波動收斂", note: "VIX 回落至 18 以下" },
    { cond: "出現 ≥ 2 檔 scanner_score ≥ 7 的候選", note: "目前最高僅 5 分" }
  ],
  scanner_top1: {
    code: "3017", name: "奇鋐", score: 5,
    what_scanner_sees: "散熱題材龍頭，近期帶量突破前高，外資連 3 日小幅買超，技術面與題材面都站在多方。",
    what_we_dont_like: "已經連漲 5 天，短線乖離過大，現在追等於買在情緒高點。風險報酬比只有 1.8，低於系統 2.5 的門檻。寧可等它回測均線再說。"
  },
  micro_pick: null,
  watchlist_zones: [
    { code:"3546", name:"宇峻", priority:5, px:71.0, start:72, add:64, status:"起手區", hit:true, rev:{yoy:44,month:"6月",trend:"高檔穩健",signal:"confirm",brief:"6月營收 YoY +44%（高檔穩健、連5月正、累計+48%、毛利89%🏰·26Q1）"}, chip:{big:34,k1000:23,retail:20,signal:"neutral",brief:"大戶34%·千張23%·散戶20%（散戶多籌碼鬆、趨勢累積中）"}},
    { code:"5306", name:"桂盟", priority:6, px:94.5, start:88, add:82, status:"還遠", hit:false, rev:{yoy:32,trend:"🔥加速",signal:"confirm",brief:"6月營收 YoY +32%（🔥加速、連4月正、累計+8%）"} },
    { code:"4571", name:"鈞興-KY", priority:8, px:163.0, start:160, add:142, status:"接近", hit:false, rev:{yoy:6,trend:"持平",signal:"neutral",brief:"6月營收 YoY +6%（持平、連3月正、累計-1%）"} }
  ],
  watchlist_events: [ { symbol:"3546.TWO", name:"宇峻", date:"2026-08-11", type:"Q2財報", days_away:4, note:"檢驗遊戲營收持續性、毛利89%守不守得住" } ],
  probation: { status:"probation", badge:"試用期 0/10", n:0, mean_alpha:null, reason:"C1 上線 0.0 週、尚無結案實單。累積中——先讓它跑、別當主力。" }
};

let DATA;
{
  const raw = (document.getElementById('pick-data')?.textContent || '').trim();
  if (!raw || raw.startsWith('{{')) {
    // Mockup mode: template opened directly, token unreplaced → demo data.
    DATA = SAMPLE;
  } else {
    try { DATA = JSON.parse(raw); }
    catch(e){
      // Real page with broken data: never silently show SAMPLE as if it
      // were today's analysis — render an explicit error state instead.
      DATA = {};
      document.body.insertAdjacentHTML('afterbegin',
        '<div style="background:#8a2222;color:#fff;padding:14px 20px;font-size:15px;line-height:1.6">' +
        '⚠ 本頁資料載入失敗（pick-data JSON 解析錯誤）。以下欄位皆為空白佔位，' +
        '不是今日實際分析——請檢查 picks/generate.py 的輸出。</div>');
    }
  }
}

const f = (v, dflt='—') => (v === undefined || v === null || v === '') ? dflt : v;
const WD = ['日','一','二','三','四','五','六'];
function fmtDate(iso){
  if(!iso) return {full:'—', wd:'', mono:'—'};
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return {full:iso, wd:'', mono:iso};
  return {
    full: `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`,
    wd: `星期${WD[d.getDay()]}`,
    mono: iso.replace(/-/g,' · ')
  };
}

const dt = fmtDate(DATA.date);
document.getElementById('rb-date').textContent = dt.mono;
document.getElementById('hero-date').innerHTML = `<span>${dt.full}</span><span class="weekday">${dt.wd}</span>`;
document.getElementById('hero-verdict').textContent = f(DATA.verdict, '今日觀望');
document.getElementById('hero-sub').innerHTML =
  `今天系統選擇<span class="accent"> 不出手</span>。耐心也是一種部位。` + `
  <span class="hero-chiprow" style="margin-top:14px">
    <span class="chip regime"><span class="dot"></span>REGIME · ${f(DATA.regime)}</span>
    <span class="chip risk"><span class="dot"></span>風險 · ${f(DATA.risk_level)}</span>
  </span>`;

/* 恐慌日 SOP 提示條（連動 #3）— 這天觸發了寶藏系統的恐慌日條件 */
(function renderPanicStrip(){
  const p = DATA.panic_sop;
  if(!p || !p.triggered) return;
  const hero = document.querySelector('.hero');
  if(!hero) return;
  hero.insertAdjacentHTML('afterend', `
    <div class="panic-strip">🚨 <b>恐慌日 SOP 條件觸發</b> — ${(p.reasons||[]).join(' · ')}。
    Swing 停開新倉；長波買點窗口 → 寶藏股研究室「恐慌日SOP.md」照表操課。</div>`);
})();

/* 寶藏觀察名單·入場區（連動 #4）— 永遠列出全名單＋現價＋起手/加碼價，
   到區間者醒目標示。觀望日也顯示：長波埋伏與波段是否出手無關。 */
(function renderWatchlistZones(){
  const zs = DATA.watchlist_zones;
  if(!zs || !zs.length) return;
  const hero = document.querySelector('.hero');
  if(!hero) return;
  const badge = s => {
    if(s==='加碼區') return '<span style="background:#C0392B;color:#fff;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700">🔥 加碼區</span>';
    if(s==='起手區') return '<span style="background:#C9A84C;color:#1a1a1a;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:700">🎯 起手區</span>';
    if(s==='接近')  return '<span style="color:#C9A84C;font-size:11px;font-weight:600">接近</span>';
    return '<span style="color:var(--text3,#8a8a8a);font-size:11px">還遠</span>';
  };
  const revColor = {confirm:'#1E8449', warn:'#C0392B', caution:'#B9770E', neutral:'var(--text3,#8a8a8a)'};
  const revTail = {confirm:' ← 論述兌現', warn:' ← 論述亮紅燈', caution:'', neutral:''};
  const prioBadge = p => {
    if(!p) return '';
    const t = p<=3?{t:'主菜',c:'#1E8449'}:p<=5?{t:'時機',c:'#C9A84C'}:p<=7?{t:'配菜',c:'#8a8a8a'}:{t:'彩券',c:'#B9770E'};
    return `<span style="display:inline-block;font-size:10px;font-weight:700;color:${t.c};border:1px solid ${t.c};border-radius:4px;padding:0 4px;margin-right:5px">#${p} ${t.t}</span>`;
  };
  const rows = zs.map(z=>{
    const hit = z.status==='加碼區' || z.status==='起手區';
    const owned = !!z.held;
    const bg = owned ? 'background:rgba(30,132,73,0.10);border-left:3px solid #1E8449;'
             : hit ? 'background:rgba(201,168,76,0.15);' : '';
    const heldBadge = owned ? `<span style="display:inline-block;font-size:10px;font-weight:700;color:#fff;background:${(z.held.pnl_pct??0)>=0?'#1E8449':'#C0392B'};border-radius:4px;padding:0 5px;margin-left:5px">✅持有 ${z.held.shares}股 ${(z.held.pnl_pct??0)>=0?'+':''}${z.held.pnl_pct??''}%</span>` : '';
    const thinMark = z.thin ? ' <span style="color:#C0392B;font-size:10px">💧薄量</span>' : '';
    const sub = hit ? `<div style="font-size:10.5px;color:var(--text3,#8a8a8a);padding:0 8px 5px;line-height:1.35">🎯 進場區第 ${z.days_in_zone||1} 天 · ${(z.note||'').slice(0,64)}</div>` : '';
    const rev = z.rev ? `<div style="font-size:10.5px;padding:0 8px 5px;line-height:1.3;color:${revColor[z.rev.signal]||revColor.neutral};font-weight:${(z.rev.signal==='warn'||z.rev.signal==='confirm')?600:400}">📈 ${z.rev.brief}${revTail[z.rev.signal]||''}</div>` : '';
    const chipColor = {accumulate:'#1E8449', distribute:'#C0392B', neutral:'var(--text3,#8a8a8a)'};
    const chip = z.chip ? `<div style="font-size:10.5px;padding:0 8px 5px;line-height:1.3;color:${chipColor[z.chip.signal]||chipColor.neutral};font-weight:${(z.chip.signal==='accumulate'||z.chip.signal==='distribute')?600:400}">💰 聰明錢：${z.chip.brief}</div>` : '';
    const zoneLabel = owned ? `加碼≤${z.add??'—'}（持有中，跌到加碼區才補）` : `起手≤${z.start??'—'} · 加碼≤${z.add??'—'}`;
    return `<div style="margin-top:3px;border-radius:5px;${bg}">
      <div style="display:flex;align-items:center;gap:8px;padding:5px 8px 3px;line-height:1.4">
        <span style="flex:1;font-size:12px">${prioBadge(z.priority)}<b>${z.code}</b> ${z.name}${heldBadge}${thinMark}</span>
        <span style="font-size:12px;${hit?'color:#C9A84C;font-weight:700':''}">現 ${z.px??'—'}</span>
        <span style="font-size:11px;color:var(--text3,#8a8a8a)">${zoneLabel}</span>
        <span style="min-width:60px;text-align:right">${owned?'':badge(z.status)}</span>
      </div>${rev}${chip}${sub}
    </div>`;
  }).join('');
  const anyHit = zs.some(z=>z.status==='加碼區'||z.status==='起手區');
  const asOf = (zs.find(z=>z.rev)||{}).rev; const asOfTxt = asOf&&asOf.month ? ` · 營收截至${asOf.month}` : '';
  const evs = DATA.watchlist_events || [];
  const evLine = evs.length ? `<div style="font-size:11px;color:#C9A84C;margin:3px 0 1px;padding:5px 8px;background:rgba(201,168,76,0.10);border-radius:5px">📅 近期財報/事件 &nbsp;${evs.map(e=>`${(e.date||'').slice(5)} <b>${e.name}</b> ${e.type||''}${e.days_away===0?'（今天）':e.days_away>0?`（還${e.days_away}天）`:'（剛過）'}`).join(' &nbsp;·&nbsp; ')}</div>` : '';
  hero.insertAdjacentHTML('afterend', `
    <div style="max-width:760px;margin:14px auto 0;padding:10px 14px;border:1px solid rgba(201,168,76,${anyHit?0.65:0.35});border-radius:8px;background:rgba(201,168,76,0.05)">
      <div style="font-size:11px;font-weight:800;letter-spacing:1px;color:#C9A84C">⭐ 寶藏觀察名單 · 入場區${anyHit?' &nbsp;—&nbsp; 🎯 有標的到價！':''}</div>
      <div style="font-size:11px;color:var(--text3,#8a8a8a);margin:2px 0 3px">依 <b>#買進優先序</b>排（主菜🟢>時機🟡>配菜⚪>彩券🟠，週檢更新）· 到價金底醒目 · 📈=月營收動能 · 💰=大戶籌碼(聰明錢) · 掛限價分批別市價追${asOfTxt}</div>
      ${evLine}${rows}
    </div>`);
})();

/* 波段 C1 試用期體檢徽章（止血開關）— 副菜別當主力、別默默失血 */
(function renderProbation(){
  const p = DATA.probation;
  if(!p || !p.badge) return;
  const hero = document.querySelector('.hero');
  if(!hero) return;
  const c = p.status==='suspended' ? {bg:'rgba(192,57,43,0.12)',bd:'#C0392B',fg:'#C0392B'}
          : p.status==='active_pass' ? {bg:'rgba(30,132,73,0.10)',bd:'rgba(30,132,73,0.5)',fg:'#1E8449'}
          : {bg:'rgba(138,138,138,0.08)',bd:'rgba(138,138,138,0.35)',fg:'var(--text3,#8a8a8a)'};
  hero.insertAdjacentHTML('afterend', `
    <div style="max-width:760px;margin:10px auto 0;padding:7px 12px;border:1px solid ${c.bd};border-radius:8px;background:${c.bg};font-size:11px;color:${c.fg};line-height:1.4">
      🎲 <b>波段 C1</b> · ${p.badge}<span style="color:var(--text3,#8a8a8a)"> — ${p.reason||''}</span>
    </div>`);
})();

/* Swing book (波段在倉部位) — 有部位才顯示 */
(function renderSwingBook(){
  const ops = DATA.open_positions;
  if(!ops || !ops.length) return;
  const sec = document.getElementById('swing-sec');
  const box = document.getElementById('swing-book');
  if(!sec || !box) return;
  const maxP = DATA.max_positions || 5;
  const softP = DATA.soft_cap || 3;
  const rows = ops.map(p => {
    const waiting = p.waiting_fill;
    const cur = waiting ? '待觸價'
      : (typeof p.current_return_pct === 'number')
        ? `${p.current_return_pct >= 0 ? '+' : ''}${p.current_return_pct.toFixed(1)}%` : '—';
    const curCls = waiting ? ''
      : (typeof p.current_return_pct === 'number')
        ? (p.current_return_pct >= 0 ? 'up' : 'down') : '';
    return `
    <div class="sb-row">
      <span class="sb-id"><b>${p.stock_code}</b> ${p.stock_name || ''}</span>
      <span class="sb-date">${waiting ? ('進場區 ' + (p.entry_zone||'—')) : (p.date||'').slice(5) + ' 進'}</span>
      <span class="sb-cur ${curCls}">${cur}</span>
      <span class="sb-plan">停損 ${p.stop_loss || '—'} · 目標 ${p.target || '—'} · D+${p.hold_days_actual || 0}</span>
    </div>`;
  }).join('');
  const capNote = ops.length >= softP ? `達基本 ${softP}·雷達高分可加至 ${maxP}` : `基本 ${softP}/上限 ${maxP}`;
  box.innerHTML = `
    <div class="sb-head">📒 波段在倉 ${ops.length} 檔 · ${capNote} — 今日重點是照顧它們</div>
    ${rows}`;
  sec.style.display = 'block';
})();

document.getElementById('why-watching').className = 'prose lead-cap';
document.getElementById('why-watching').innerHTML =
  (f(DATA.why_watching, DATA.context_paragraph) || '—')
    .split('\n').filter(Boolean).map(p => `<p>${p}</p>`).join('') || '<p class="empty-field">—</p>';

/* Triggers */
document.getElementById('trigger-list').innerHTML =
  (DATA.reactivation_triggers||[]).map(t => `
    <div class="trigger-row">
      <span class="tr-arrow">→</span>
      <div class="tr-text">
        <div class="tr-cond">${f(t.cond)}</div>
        ${t.note ? `<div class="tr-note">${t.note}</div>` : ''}
      </div>
    </div>`).join('') || '<p class="empty-field">無條件設定。</p>';

/* Scanner */
const sc = DATA.scanner_top1;
if(sc && (sc.code || sc.name)){
  document.getElementById('sc-code').textContent = f(sc.code);
  document.getElementById('sc-name').textContent = f(sc.name);
  document.getElementById('sc-score').textContent = `score ${f(sc.score)}`;
  document.getElementById('sc-sees').textContent = f(sc.what_scanner_sees, '—');
  document.getElementById('sc-avoid').textContent = f(sc.what_we_dont_like, '—');
} else {
  document.getElementById('scanner-sec').style.display = 'none';
}

/* Micro pick */
const mp = DATA.micro_pick;
if(mp && (mp.text || mp.code || typeof mp === 'string')){
  document.getElementById('micro-sec').style.display = '';
  const body = typeof mp === 'string' ? mp :
    `${mp.code ? `<b>${mp.code} ${mp.name||''}</b> · ` : ''}${mp.text || mp.rationale || ''}`;
  document.getElementById('micro-body').innerHTML = `<p>${body}</p>`;
}

if(DATA.prev_date) document.getElementById('prev-pick').href = DATA.prev_date + '.html';
else document.getElementById('prev-pick').style.opacity = '.35';
if(DATA.next_date) document.getElementById('next-pick').href = DATA.next_date + '.html';
else document.getElementById('next-pick').style.opacity = '.35';

if(window.applyGlossary) window.applyGlossary();
</script>
