<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>又瑄投資AI — Decision OS</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root {
  --bg:#060B17; --bg2:#0C1526; --bg3:#121D33; --bg4:#18263E;
  --border:#1A2B48; --border2:#243D68;
  --text:#DDE5F5; --text2:#7A8EBD; --text3:#3A4D7A;
  --green:#00C896; --green-dim:#091F18;
  --red:#FF4560; --red-dim:#200B11;
  --yellow:#FFB800; --yellow-dim:#201800;
  --blue:#3D8EFF; --blue-dim:#0A1930;
  --orange:#FF7A00; --purple:#A259FF;
  --accent:#3D8EFF;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"SF Mono","JetBrains Mono","Fira Code","Consolas","Noto Sans TC",monospace;font-size:13px;line-height:1.6;min-height:100vh;overflow-x:hidden}

/* ═══ COMMAND BAR (sticky) ═══════════════════════════════════════════ */
.cmd-bar {
  position:sticky;top:0;z-index:100;
  background:rgba(6,11,23,.95);
  border-bottom:1px solid var(--border2);
  backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:56px;gap:12px;
}
.cmd-left{display:flex;align-items:center;gap:10px;flex-shrink:0}
.cmd-logo{width:28px;height:28px}
.cmd-title{font-size:13px;font-weight:700;color:var(--text2);letter-spacing:.5px}

.cmd-verdict-wrap{display:flex;flex-direction:column;align-items:center;gap:1px}
.cmd-verdict{font-size:18px;font-weight:800;letter-spacing:.5px;line-height:1}
.cmd-verdict-label{font-size:10px;color:var(--text3);letter-spacing:1px}

.cmd-right{display:flex;align-items:center;gap:16px;flex-shrink:0}
.cmd-budget{display:flex;gap:6px;align-items:center}
.budget-pill{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
.budget-dot{width:6px;height:6px;border-radius:50%}
.cmd-regime{background:var(--bg3);border:1px solid var(--border2);border-radius:4px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--text2)}
.cmd-time{font-size:11px;color:var(--text3);white-space:nowrap}

/* ═══ TAB NAV ════════════════════════════════════════════════════════ */
.tab-nav{
  display:flex;gap:0;
  background:var(--bg2);
  border-bottom:1px solid var(--border);
  padding:0 20px;
  position:sticky;top:56px;z-index:99;
}
.tab-btn{
  background:none;border:none;color:var(--text3);
  font-family:inherit;font-size:11px;font-weight:700;
  letter-spacing:1px;padding:12px 18px;cursor:pointer;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  transition:color .15s,border-color .15s;
}
.tab-btn:hover{color:var(--text2)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ═══ PANELS ════════════════════════════════════════════════════════ */
.panel{display:none;padding:20px;max-width:1400px;margin:0 auto}
.panel.active{display:block}

/* ═══ SIGNAL PANEL ══════════════════════════════════════════════════ */
.signal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.signal-title{font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text3)}
.data-gap-badge{font-size:10px;color:var(--orange);border:1px solid var(--orange);border-radius:3px;padding:2px 7px;letter-spacing:.5px}

.gauge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.gauge-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.gauge-grid{grid-template-columns:1fr}}

.gauge-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:14px 14px 10px;
}
.gauge-card.na{opacity:.45}
.gauge-card-label{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--text3);margin-bottom:6px}

/* Arc gauge (for -1 to 1) */
.arc-gauge{width:100%;max-height:80px;display:block}

/* Bar gauge (for 0 to 1) */
.bar-track{background:var(--bg4);border-radius:3px;height:8px;margin:10px 0 6px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .6s ease}
.bar-value{font-size:18px;font-weight:800;font-family:inherit;line-height:1}
.gauge-source{font-size:9px;color:var(--text3);margin-top:4px;line-height:1.4;word-break:break-word}
.na-label{font-size:14px;font-weight:700;color:var(--text3);padding:12px 0 6px}
.na-sub{font-size:9px;color:var(--text3)}

/* ═══ TODAY PANEL ════════════════════════════════════════════════════ */
.today-grid{display:grid;grid-template-columns:300px 1fr;gap:16px}
@media(max-width:800px){.today-grid{grid-template-columns:1fr}}

.pick-card{
  background:var(--bg2);border:1px solid var(--border2);border-radius:10px;
  padding:20px;display:flex;flex-direction:column;gap:10px;
}
.pick-none{background:var(--bg2);border:1px dashed var(--border);border-radius:10px;padding:24px;color:var(--text3);font-size:12px;text-align:center}
.pick-header{display:flex;align-items:center;justify-content:space-between}
.pick-badge{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--yellow);background:var(--yellow-dim);border:1px solid var(--yellow);border-radius:3px;padding:2px 7px}
.pick-code{font-size:28px;font-weight:900;color:var(--text);line-height:1}
.pick-name{font-size:13px;color:var(--text2);margin-top:2px}
.pick-verdict{font-size:12px;color:var(--text2);padding:8px;background:var(--bg3);border-radius:6px;border-left:3px solid var(--accent)}
.pick-signals{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.sig-pill{font-size:9px;font-weight:700;background:var(--green-dim);color:var(--green);border-radius:3px;padding:2px 6px}

.actions-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:20px}
.actions-title{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--text3);margin-bottom:12px}
.action-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.action-row:last-child{border-bottom:none}
.action-urgency{font-size:9px;font-weight:700;border-radius:3px;padding:2px 7px;white-space:nowrap;flex-shrink:0;margin-top:1px}
.u-high{background:var(--red-dim);color:var(--red);border:1px solid var(--red)}
.u-med{background:var(--yellow-dim);color:var(--yellow);border:1px solid var(--yellow)}
.u-low{background:var(--bg4);color:var(--text2);border:1px solid var(--border2)}
.action-target{font-size:12px;font-weight:700;color:var(--text);min-width:60px;flex-shrink:0}
.action-detail{font-size:11px;color:var(--text2);line-height:1.5}

.flow-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:12px}
.flow-dir{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px}
.flag-list{display:flex;flex-direction:column;gap:4px}
.flag-item{font-size:10px;color:var(--yellow);padding:3px 8px;background:var(--yellow-dim);border-radius:3px}

.master-summary{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:14px;margin-top:12px;font-size:12px;color:var(--text2);line-height:1.7;border-left:3px solid var(--accent)}

/* ═══ DESKS PANEL ════════════════════════════════════════════════════ */
.desk-section{background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden}
.desk-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;cursor:pointer;user-select:none;
  transition:background .15s;
}
.desk-header:hover{background:var(--bg3)}
.desk-header-left{display:flex;align-items:center;gap:10px}
.desk-icon{font-size:14px}
.desk-name{font-size:12px;font-weight:700;color:var(--text)}
.desk-verdict-badge{font-size:10px;font-weight:700;border-radius:3px;padding:2px 8px}
.desk-conf-wrap{display:flex;align-items:center;gap:6px}
.desk-conf-bar{width:60px;height:4px;background:var(--bg4);border-radius:2px;overflow:hidden}
.desk-conf-fill{height:100%;border-radius:2px;background:var(--blue)}
.desk-conf-val{font-size:10px;color:var(--text3)}
.desk-chevron{color:var(--text3);font-size:10px;transition:transform .2s}
.desk-chevron.open{transform:rotate(90deg)}

.desk-body{display:none;padding:0 16px 16px;border-top:1px solid var(--border)}
.desk-body.open{display:block}
.desk-summary{font-size:12px;color:var(--text2);padding:10px 0;line-height:1.7}
.desk-recs{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.desk-rec{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--bg3);border-radius:5px;border-left:2px solid var(--border2)}
.desk-rec-action{font-size:10px;font-weight:700;color:var(--blue);min-width:36px}
.desk-rec-target{font-size:11px;font-weight:700;color:var(--text);min-width:50px}
.desk-rec-detail{font-size:11px;color:var(--text2)}
.desk-insights{margin-top:10px}
.desk-insight-item{font-size:11px;color:var(--text2);padding:4px 0;border-bottom:1px solid var(--border)}
.desk-insight-item:last-child{border-bottom:none}
.desk-insight-item::before{content:"→ ";color:var(--accent)}

/* Wealth special fields */
.wealth-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media(max-width:600px){.wealth-metrics{grid-template-columns:1fr}}
.wealth-metric{background:var(--bg3);border-radius:5px;padding:8px 10px;border:1px solid var(--border)}
.wealth-metric-label{font-size:9px;color:var(--text3);letter-spacing:.8px;margin-bottom:3px}
.wealth-metric-val{font-size:12px;font-weight:700}

/* ═══ RESEARCH PANEL ═════════════════════════════════════════════════ */
.perf-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:800px){.perf-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.perf-row{grid-template-columns:1fr 1fr}}

.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:14px 16px}
.stat-label{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--text3);margin-bottom:6px}
.stat-value{font-size:26px;font-weight:900;line-height:1}
.stat-sub{font-size:10px;color:var(--text3);margin-top:4px}

.signal-leaderboard{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
.lb-title{font-size:9px;font-weight:700;letter-spacing:1.5px;color:var(--text3);margin-bottom:12px}
.lb-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.lb-row:last-child{border-bottom:none}
.lb-rank{font-size:10px;color:var(--text3);width:16px;text-align:right;flex-shrink:0}
.lb-sig{font-size:11px;font-weight:700;color:var(--text);flex:1}
.lb-bar-wrap{width:100px;flex-shrink:0}
.lb-bar-bg{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden}
.lb-bar-fill{height:100%;background:var(--green);border-radius:3px}
.lb-pct{font-size:11px;font-weight:700;color:var(--green);width:36px;text-align:right;flex-shrink:0}
.lb-n{font-size:10px;color:var(--text3);width:28px;text-align:right;flex-shrink:0}

.research-note{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;color:var(--text3);font-size:12px;line-height:1.7}
.research-note strong{color:var(--yellow)}

/* ═══ SHARED ═════════════════════════════════════════════════════════ */
.section-label{font-size:9px;font-weight:700;letter-spacing:2px;color:var(--text3);margin-bottom:12px}
.mkt-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.mkt-chip{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:6px 12px;font-size:11px}
.mkt-chip-name{color:var(--text3);font-size:9px;letter-spacing:.5px;margin-bottom:1px}
.mkt-chip-val{font-weight:700;font-size:13px}

.err-msg{background:var(--red-dim);border:1px solid var(--red);border-radius:6px;padding:12px 16px;color:var(--red);font-size:12px;margin:20px}

/* Loading skeleton */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:10px;color:var(--text3)}
.spinner{width:28px;height:28px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite;display:inline-block;margin-right:5px}
</style>
</head>
<body>

<!-- ═══ COMMAND BAR ═══════════════════════════════════════════════════ -->
<div class="cmd-bar">
  <div class="cmd-left">
    <img src="favicon.svg" class="cmd-logo" alt="">
    <span class="cmd-title">又瑄投資AI</span>
  </div>
  <div class="cmd-verdict-wrap">
    <div class="cmd-verdict" id="cmd-verdict">—</div>
    <div class="cmd-verdict-label">TODAY'S VERDICT</div>
  </div>
  <div class="cmd-right">
    <div class="cmd-budget" id="cmd-budget"></div>
    <div class="cmd-regime" id="cmd-regime">—</div>
    <div class="cmd-time" id="cmd-time">—</div>
  </div>
</div>

<!-- ═══ TAB NAV ═══════════════════════════════════════════════════════ -->
<div class="tab-nav">
  <button class="tab-btn active" onclick="showTab('signal')">SIGNAL</button>
  <button class="tab-btn" onclick="showTab('today')">TODAY</button>
  <button class="tab-btn" onclick="showTab('desks')">DESKS</button>
  <button class="tab-btn" onclick="showTab('research')">RESEARCH</button>
</div>

<!-- ═══ PANEL: SIGNAL ════════════════════════════════════════════════ -->
<div class="panel active" id="panel-signal">
  <div class="signal-header">
    <div class="signal-title">SIGNAL VECTOR</div>
    <div id="signal-meta" class="data-gap-badge"></div>
  </div>
  <!-- Market chips -->
  <div class="mkt-bar" id="mkt-bar"></div>
  <div class="gauge-grid" id="gauge-grid">
    <div class="loading-wrap"><div class="spinner"></div><span>載入信號...</span></div>
  </div>
</div>

<!-- ═══ PANEL: TODAY ════════════════════════════════════════════════ -->
<div class="panel" id="panel-today">
  <div class="today-grid">
    <div id="pick-area"></div>
    <div>
      <div class="actions-card">
        <div class="actions-title">TOP 3 ACTIONS</div>
        <div id="actions-list"></div>
      </div>
      <div id="flow-area"></div>
      <div id="master-summary-area"></div>
    </div>
  </div>
</div>

<!-- ═══ PANEL: DESKS ════════════════════════════════════════════════ -->
<div class="panel" id="panel-desks">
  <div id="desks-area"></div>
</div>

<!-- ═══ PANEL: RESEARCH ════════════════════════════════════════════= -->
<div class="panel" id="panel-research">
  <div class="perf-row" id="perf-stats"></div>
  <div id="signal-lb"></div>
  <div id="research-note"></div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// Utilities
// ════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);

function showTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  $('panel-' + name).classList.add('active');
  event.target.classList.add('active');
}

function verdictColor(v) {
  if (!v) return 'var(--text2)';
  if (/進攻|買進|加碼/.test(v)) return 'var(--green)';
  if (/防守|賣出|減碼/.test(v)) return 'var(--red)';
  if (/警戒|危險/.test(v)) return 'var(--red)';
  if (/留意/.test(v)) return 'var(--yellow)';
  return 'var(--text2)';
}

function riskColor(level) {
  const map = { low:'var(--green)', moderate:'var(--text2)', elevated:'var(--yellow)', high:'var(--orange)', extreme:'var(--red)' };
  return map[level] || 'var(--text2)';
}

function urgencyClass(u) {
  if (!u) return 'u-low';
  return u === 'HIGH' ? 'u-high' : u === 'MED' ? 'u-med' : 'u-low';
}

function fmtChg(v) {
  if (v == null) return '—';
  const sign = v > 0 ? '+' : '';
  return `${sign}${parseFloat(v).toFixed(2)}%`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ════════════════════════════════════════════════════════════════════
// Command Bar
// ════════════════════════════════════════════════════════════════════
function renderCmdBar(master, cf, regime, generatedAt) {
  const verdict = master.verdict || '—';
  const col = verdictColor(verdict);
  $('cmd-verdict').textContent = verdict;
  $('cmd-verdict').style.color = col;

  const budget = cf.budget || {};
  const tp = Math.round((budget.trading || 0) * 100);
  const pp = Math.round((budget.portfolio || 0) * 100);
  const cp = Math.round((budget.cash || 0) * 100);
  $('cmd-budget').innerHTML =
    `<div class="budget-pill"><div class="budget-dot" style="background:var(--accent)"></div><span style="color:var(--accent)">${tp}%</span><span style="color:var(--text3)"> TRD</span></div>` +
    `<div class="budget-pill"><div class="budget-dot" style="background:var(--purple)"></div><span style="color:var(--purple)">${pp}%</span><span style="color:var(--text3)"> PRT</span></div>` +
    `<div class="budget-pill"><div class="budget-dot" style="background:var(--text2)"></div><span style="color:var(--text2)">${cp}%</span><span style="color:var(--text3)"> CSH</span></div>`;

  const rn = regime.market_regime || '—';
  const rl = regime.risk_level || 'moderate';
  $('cmd-regime').textContent = rn;
  $('cmd-regime').style.color = riskColor(rl);

  $('cmd-time').innerHTML = `<span class="live-dot"></span>${fmtDate(generatedAt)}`;
}

// ════════════════════════════════════════════════════════════════════
// Market chips
// ════════════════════════════════════════════════════════════════════
function renderMktBar(snap) {
  if (!snap) return;
  const chips = [
    { n:'TAIEX', v:snap.taiex?.close, chg:snap.taiex?.change_pct },
    { n:'S&P500', v:snap.sp500?.close, chg:snap.sp500?.change_pct },
    { n:'VIX',   v:snap.vix?.value || snap.vix?.close, chg:null },
    { n:'USD/TWD',v:snap.usd_twd, chg:null },
  ].filter(c => c.v != null);

  $('mkt-bar').innerHTML = chips.map(c => {
    const chgColor = c.chg > 0 ? 'var(--green)' : c.chg < 0 ? 'var(--red)' : 'var(--text2)';
    const chgStr = c.chg != null ? `<span style="color:${chgColor}"> ${fmtChg(c.chg)}</span>` : '';
    return `<div class="mkt-chip">
      <div class="mkt-chip-name">${c.n}</div>
      <div class="mkt-chip-val">${typeof c.v === 'number' ? c.v.toLocaleString('en-US',{maximumFractionDigits:2}) : c.v}${chgStr}</div>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════════════════════
// Signal Gauges
// ════════════════════════════════════════════════════════════════════
function arcGaugeSVG(value, color) {
  // -1 to 1, semicircle: left(-1)→top(0)→right(1)
  const angle = Math.PI * (1 - (value + 1) / 2);
  const cx = 50, cy = 54, r = 36;
  const nx = (cx + r * Math.cos(angle)).toFixed(2);
  const ny = (cy - r * Math.sin(angle)).toFixed(2);
  const sign = value >= 0 ? '+' : '';
  return `<svg class="arc-gauge" viewBox="0 0 100 70">
    <path d="M14,54 A36,36 0 0,1 50,18" fill="none" stroke="rgba(255,69,96,.25)" stroke-width="7" stroke-linecap="round"/>
    <path d="M50,18 A36,36 0 0,1 86,54" fill="none" stroke="rgba(0,200,150,.25)" stroke-width="7" stroke-linecap="round"/>
    <circle cx="14" cy="54" r="2" fill="var(--red)" opacity=".4"/>
    <circle cx="86" cy="54" r="2" fill="var(--green)" opacity=".4"/>
    <circle cx="50" cy="18" r="2" fill="var(--text3)" opacity=".4"/>
    <line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="${color}"/>
    <text x="50" y="45" text-anchor="middle" fill="${color}" font-size="14" font-weight="800" font-family="monospace">${sign}${value.toFixed(2)}</text>
  </svg>`;
}

function barGaugeHTML(value, color) {
  const pct = Math.round(Math.max(0, Math.min(1, value)) * 100);
  return `<div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
          <div class="bar-value" style="color:${color}">${value.toFixed(2)}</div>`;
}

function sigColor(value, inverted) {
  if (inverted) {
    return value > 0.65 ? 'var(--red)' : value > 0.35 ? 'var(--yellow)' : 'var(--green)';
  }
  return value > 0.6 ? 'var(--green)' : value > 0.35 ? 'var(--yellow)' : 'var(--red)';
}

function renderSignalPanel(sv, dataGaps) {
  if (!sv || Object.keys(sv).length === 0) {
    $('gauge-grid').innerHTML = '<div style="color:var(--text3);padding:20px;font-size:12px">Signal vector not available — run the pipeline first.</div>';
    return;
  }

  // Meta badge
  const gaps = dataGaps || sv._data_gaps || [];
  $('signal-meta').textContent = gaps.length ? `${gaps.length} signal N/A` : '全部信號可用';

  const GAUGES = [
    {
      key:'market_regime_score', label:'MARKET REGIME', type:'arc',
      desc:'體制分數：-1=恐慌 → 0=中性 → +1=AI主升段',
      colorFn: v => v > 0.2 ? 'var(--green)' : v < -0.2 ? 'var(--red)' : 'var(--yellow)',
    },
    {
      key:'trend_strength', label:'TREND STRENGTH', type:'bar', inverted:false,
      desc:'趨勢強度：TAIEX 日漲跌 + market_overview',
    },
    {
      key:'risk_pressure', label:'RISK PRESSURE', type:'bar', inverted:true,
      desc:'市場壓力：VIX + tw_short_term + devils_advocate',
    },
    {
      key:'volatility_risk', label:'VOLATILITY RISK', type:'bar', inverted:true,
      desc:'波動風險：VIX(70%) + TAIEX日內波動(30%)',
    },
    {
      key:'ai_sector_strength', label:'AI SECTOR', type:'bar', inverted:false,
      desc:'AI類股：由新聞AI關鍵字推算（非直接資料）',
    },
    {
      key:'scanner_momentum', label:'SCANNER MOMENTUM', type:'bar', inverted:false,
      desc:'掃描動能：候選股平均技術分數 / 最高分',
    },
    {
      key:'confidence_score', label:'CONFIDENCE', type:'bar', inverted:false,
      desc:'系統信心：主要Agent平均confidence，ERROR扣分',
    },
    {
      key:'foreign_flow_strength', label:'FOREIGN FLOW', type:'bar', inverted:false,
      desc:'外資流向：TWSE T86 外資買賣超（千股）',
    },
    {
      key:'breadth_score', label:'MKT BREADTH', type:'bar', inverted:false,
      desc:'市場廣度：TWSE MI_INDEX 漲跌家數',
    },
  ];

  const sources = sv._sources || {};

  $('gauge-grid').innerHTML = GAUGES.map(g => {
    const v = sv[g.key];
    const isNA = g.isNA || gaps.includes(g.key);
    const naClass = isNA ? ' na' : '';

    let visual = '';
    if (isNA) {
      visual = `<div class="na-label">N/A</div><div class="na-sub">待 batch3 資料</div>`;
    } else if (g.type === 'arc') {
      const col = g.colorFn(v);
      visual = arcGaugeSVG(v, col);
    } else {
      const col = g.colorFn ? g.colorFn(v) : sigColor(v, g.inverted);
      visual = barGaugeHTML(v, col);
    }

    const src = sources[g.key] || g.desc;
    return `<div class="gauge-card${naClass}">
      <div class="gauge-card-label">${g.label}</div>
      ${visual}
      <div class="gauge-source">${src}</div>
    </div>`;
  }).join('');
}

// ════════════════════════════════════════════════════════════════════
// Today Panel
// ════════════════════════════════════════════════════════════════════
function renderTodayPanel(agents, cf, master) {
  const pick = agents.tw_daily_pick;

  // Pick card
  if (pick && pick.verdict !== 'ERROR' && pick.pick) {
    const p = pick.pick;
    // Gather scanner signals from pick output
    const sigKeys = ['breakout_ma20','vol_surge','rsi_zone','ma_aligned','five_day_high','rs_signal'];
    const sigLabels = {
      breakout_ma20:'MA20突破', vol_surge:'量爆', rsi_zone:'RSI強', ma_aligned:'均線多排',
      five_day_high:'5日高', rs_signal:'強於大盤'
    };
    const rawSigs = pick.scanner_signals || pick.core_logic || {};
    const sigs = sigKeys.filter(k => rawSigs[k] || (Array.isArray(pick.scanner_signals) && pick.scanner_signals.includes(k)));
    const pickColor = verdictColor(pick.verdict);
    $('pick-area').innerHTML = `<div class="pick-card">
      <div class="pick-header">
        <div class="pick-badge">TODAY'S PICK</div>
        <div style="font-size:10px;color:${pickColor};font-weight:700">${pick.verdict || ''}</div>
      </div>
      <div>
        <div class="pick-code">${p.code || '—'}</div>
        <div class="pick-name">${p.name || '—'}</div>
      </div>
      ${p.rationale ? `<div class="pick-verdict">${p.rationale.slice(0,120)}</div>` : ''}
      ${sigs.length ? `<div class="pick-signals">${sigs.map(s=>`<div class="sig-pill">${sigLabels[s]||s}</div>`).join('')}</div>` : ''}
    </div>`;
  } else {
    $('pick-area').innerHTML = `<div class="pick-none">盤後分析完成後顯示<br>(13:00+ 執行)</div>`;
  }

  // Actions
  const recs = master.recommendations || [];
  if (recs.length === 0) {
    $('actions-list').innerHTML = '<div style="color:var(--text3);font-size:12px;padding:10px 0">無建議</div>';
  } else {
    $('actions-list').innerHTML = recs.slice(0,3).map(r => `
      <div class="action-row">
        <div class="action-urgency ${urgencyClass(r.urgency)}">${r.urgency || 'LOW'}</div>
        <div class="action-target">${r.action || ''} ${r.target || ''}</div>
        <div class="action-detail">${(r.detail || '').slice(0,80)}</div>
      </div>`).join('');
  }

  // Capital Flow detail
  const flags = (cf.override_flags || []).filter(f => !f.includes('STRUCTURAL_NOTE'));
  $('flow-area').innerHTML = `<div class="flow-card">
    <div class="flow-dir">${cf.flow_direction || '—'}</div>
    ${flags.length ? `<div class="flag-list">${flags.map(f=>`<div class="flag-item">⚡ ${f}</div>`).join('')}</div>` : '<div style="color:var(--green);font-size:11px">無強制規則觸發</div>'}
  </div>`;

  // Master summary
  const s = master.summary || '';
  if (s) {
    $('master-summary-area').innerHTML = `<div class="master-summary">${s.slice(0,200)}</div>`;
  }
}

// ════════════════════════════════════════════════════════════════════
// Desks Panel
// ════════════════════════════════════════════════════════════════════
function deskVerdictStyle(verdict) {
  const col = verdictColor(verdict);
  return `background:${col}18;color:${col};border:1px solid ${col}40`;
}

function toggleDesk(id) {
  const body = document.getElementById(id + '-body');
  const chev = document.getElementById(id + '-chev');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
}

function renderDeskSection(id, icon, name, desk, openByDefault) {
  if (!desk || desk.verdict === 'ERROR') {
    return `<div class="desk-section">
      <div class="desk-header">
        <div class="desk-header-left">
          <span class="desk-icon">${icon}</span>
          <span class="desk-name">${name}</span>
          <span class="desk-verdict-badge" style="background:var(--red-dim);color:var(--red);border:1px solid var(--red)">ERROR</span>
        </div>
      </div>
    </div>`;
  }

  const conf = parseFloat(desk.confidence || 0.5);
  const recs = (desk.recommendations || []).slice(0, 4);
  const insights = (desk.key_insights || []).slice(0, 3);

  // Wealth-specific extra fields
  let wealthExtra = '';
  if (id === 'wealth') {
    const metrics = [
      { label:'STRUCTURAL RISK', val: desk.structural_risk || '—', col: desk.structural_risk==='high'?'var(--orange)':desk.structural_risk==='moderate'?'var(--yellow)':'var(--green)' },
      { label:'LIQUIDITY RISK', val: desk.liquidity_risk || desk.risk_level || '—', col: riskColor(desk.liquidity_risk || desk.risk_level) },
      { label:'CASHFLOW', val: desk.cashflow_stability || '—', col: desk.cashflow_stability==='critical'?'var(--red)':desk.cashflow_stability==='tight'?'var(--orange)':desk.cashflow_stability==='adequate'?'var(--yellow)':'var(--green)' },
    ];
    wealthExtra = `<div class="wealth-metrics">${metrics.map(m=>`
      <div class="wealth-metric">
        <div class="wealth-metric-label">${m.label}</div>
        <div class="wealth-metric-val" style="color:${m.col}">${m.val}</div>
      </div>`).join('')}</div>`;
  }

  const openClass = openByDefault ? ' open' : '';

  return `<div class="desk-section">
    <div class="desk-header" onclick="toggleDesk('${id}')">
      <div class="desk-header-left">
        <span class="desk-icon">${icon}</span>
        <span class="desk-name">${name}</span>
        <span class="desk-verdict-badge" style="${deskVerdictStyle(desk.verdict)}">${desk.verdict}</span>
      </div>
      <div class="desk-conf-wrap">
        <div class="desk-conf-bar"><div class="desk-conf-fill" style="width:${Math.round(conf*100)}%"></div></div>
        <div class="desk-conf-val">${conf.toFixed(2)}</div>
        <div class="desk-chevron ${openByDefault?'open':''}" id="${id}-chev">▶</div>
      </div>
    </div>
    <div class="desk-body${openClass}" id="${id}-body">
      ${wealthExtra}
      <div class="desk-summary">${(desk.summary || '').slice(0, 200)}</div>
      ${insights.length ? `<div class="desk-insights">${insights.map(i=>`<div class="desk-insight-item">${i}</div>`).join('')}</div>` : ''}
      ${recs.length ? `<div class="desk-recs">${recs.map(r=>`
        <div class="desk-rec">
          <div class="desk-rec-action">${r.action||''}</div>
          <div class="desk-rec-target">${r.target||''}</div>
          <div class="desk-rec-detail">${(r.detail||'').slice(0,80)}</div>
        </div>`).join('')}</div>` : ''}
    </div>
  </div>`;
}

function renderDesksPanel(agents) {
  const desks = [
    { id:'trading',   icon:'📈', name:'Trading Desk',   key:'trading_master',   open:true },
    { id:'portfolio', icon:'📊', name:'Portfolio Desk', key:'portfolio_master', open:false },
    { id:'wealth',    icon:'🏦', name:'Wealth Desk',    key:'wealth_master',    open:false },
    { id:'da',        icon:'🔴', name:"Devil's Advocate", key:'devils_advocate', open:false },
  ];
  $('desks-area').innerHTML = desks.map(d =>
    renderDeskSection(d.id, d.icon, d.name, agents[d.key], d.open)
  ).join('');
}

// ════════════════════════════════════════════════════════════════════
// Research Panel
// ════════════════════════════════════════════════════════════════════
function renderResearchPanel(perf) {
  if (!perf || !perf.available) {
    $('perf-stats').innerHTML = `<div class="stat-card" style="grid-column:1/-1"><div class="stat-label">PERFORMANCE</div><div class="stat-value" style="font-size:16px;color:var(--text3)">暫無績效資料</div><div class="stat-sub">系統累積至少5筆已結算推薦後顯示</div></div>`;
    $('research-note').innerHTML = `<div class="research-note"><strong>Signal Attribution</strong> 分析需要 50 筆已結算推薦（目前：${perf?.total || 0}筆）。<br>每週四系統會自動檢查並通知。</div>`;
    return;
  }

  const byRegime = perf.by_regime || {};
  const stats = [
    { label:'勝率 (30日)', val: `${perf.overall_rate || 0}%`, sub:`${perf.win||0}W / ${perf.loss||0}L`, col: perf.overall_rate>=55?'var(--green)':perf.overall_rate>=45?'var(--yellow)':'var(--red)' },
    { label:'總推薦數', val: perf.total || 0, sub:'已結算', col:'var(--text)' },
    { label:'最佳 Regime', val: (() => { const top = Object.entries(byRegime).sort((a,b)=>b[1].rate-a[1].rate)[0]; return top ? top[0] : '—'; })(), sub:'勝率最高', col:'var(--blue)' },
    { label:'連勝/連敗', val: `${perf.streak || '—'}`, sub:'當前連續', col:'var(--text2)' },
  ];

  $('perf-stats').innerHTML = stats.map(s => `
    <div class="stat-card">
      <div class="stat-label">${s.label}</div>
      <div class="stat-value" style="color:${s.col}">${s.val}</div>
      <div class="stat-sub">${s.sub}</div>
    </div>`).join('');

  // Regime breakdown
  if (Object.keys(byRegime).length) {
    const rows = Object.entries(byRegime)
      .filter(([,v]) => v.total >= 2)
      .sort((a,b) => b[1].rate - a[1].rate);
    if (rows.length) {
      $('signal-lb').innerHTML = `<div class="signal-leaderboard">
        <div class="lb-title">REGIME PERFORMANCE</div>
        ${rows.map(([regime, s], i) => `
          <div class="lb-row">
            <div class="lb-rank">${i+1}</div>
            <div class="lb-sig">${regime}</div>
            <div class="lb-bar-wrap"><div class="lb-bar-bg"><div class="lb-bar-fill" style="width:${s.rate}%;background:${s.rate>=55?'var(--green)':s.rate>=45?'var(--yellow)':'var(--red)'}"></div></div></div>
            <div class="lb-pct" style="color:${s.rate>=55?'var(--green)':s.rate>=45?'var(--yellow)':'var(--red)'}">${s.rate}%</div>
            <div class="lb-n">n=${s.total}</div>
          </div>`).join('')}
      </div>`;
    }
  }

  if (perf.total < 50) {
    $('research-note').innerHTML = `<div class="research-note">
      <strong>Signal Attribution 分析</strong> 需要 50 筆已結算推薦。<br>
      目前：<strong style="color:var(--yellow)">${perf.total}</strong>/50 筆。還需 ${50 - perf.total} 筆。<br>
      每週四系統會自動檢查，達到 50 筆後觸發完整信號歸因報告。
    </div>`;
  }
}

// ════════════════════════════════════════════════════════════════════
// Main Load
// ════════════════════════════════════════════════════════════════════
async function load() {
  try {
    const r = await fetch('data/analysis.json?t=' + Date.now());
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();

    const agents = data.agents || {};
    const master = agents.master || {};
    const cf = data.capital_flow || {};
    const regime = data.regime || {};
    const sv = agents.signal_fusion || {};
    const perf = data.performance;
    const snap = data.market_snapshot || {};

    renderCmdBar(master, cf, regime, data.generated_at);
    renderMktBar(snap);
    renderSignalPanel(sv, sv._data_gaps);
    renderTodayPanel(agents, cf, master);
    renderDesksPanel(agents);
    renderResearchPanel(perf);

  } catch (e) {
    document.body.insertAdjacentHTML('afterbegin',
      `<div class="err-msg">資料載入失敗：${e.message} — 請確認 data/analysis.json 存在</div>`);
  }
}

load();
</script>
</body>
</html>
