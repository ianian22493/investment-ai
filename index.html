function applySettings(){
  const s = JSON.parse(localStorage.getItem('yuzu-settings') || '{}');

  // Patch ③: atmosphere preset (preferred path)
  const preset = s.preset || 'terminal';
  document.body.classList.remove('preset-terminal','preset-midnight','preset-cinema');
  document.body.classList.add('preset-' + preset);

  // Custom sliders override preset if mode === 'custom'
  let style = document.getElementById('yuzu-dynamic-style');
  if(!style){
    style = document.createElement('style');
    style.id = 'yuzu-dynamic-style';
    document.head.appendChild(style);
  }
  if(s.mode === 'custom'){
    const grain = s.grain ?? 0.06;
    const sat = s.saturation ?? 0.9;
    const vig = s.vignette ?? 0.6;
    style.textContent = `
      body{filter:saturate(${sat}) contrast(1.02) !important}
      body::after{opacity:${grain} !important}
      .canvas::before{background:
        radial-gradient(ellipse 70% 60% at 50% 45%, transparent ${45-vig*20}%, rgba(2,4,10,${vig}) 100%),
        radial-gradient(ellipse 100% 30% at 50% 0%, rgba(2,4,10,${vig*0.66}), transparent 70%),
        radial-gradient(ellipse 100% 30% at 50% 100%, rgba(2,4,10,${vig*0.66}), transparent 70%) !important}
    `;
  } else {
    style.textContent = '';  // let preset class drive everything
  }
}

// ═══ Patch Task 4 · Time-aware atmosphere auto-switch ═══════════
const SCHEDULE = [
  { h: 6,  m: 0,  preset: 'terminal' },
  { h: 13, m: 30, preset: 'cinema'   },
  { h: 22, m: 0,  preset: 'midnight' },
];

function currentScheduledPreset(){
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
  const mins = now.getHours() * 60 + now.getMinutes();
  let active = SCHEDULE[SCHEDULE.length - 1].preset; // wraps to midnight before 6:00
  for(const s of SCHEDULE){
    if(mins >= s.h * 60 + s.m) active = s.preset;
  }
  return active;
}

// ═══ TASK 8 · Hybrid room PNG layer ═════════════════════════════════
// Maps room keys to PNG filenames. Lobby in the grid is rendered with
// the corridor PNG (the central connector visual).
const TASK8_ROOMS = ['exec','trading','research','wealth','risk','archive','corridor'];

// Rooms that have an atmosphere-specific PNG override.
// Empty for now — base + CSS filter is sufficient. Register a room here
// when you generate e.g. rooms/risk_midnight.png and want it to swap in.
const ROOM_OVERRIDES = { /* risk: ['midnight'], exec: ['midnight'] */ };

// Wrap a room's SVG markup with an <img class="room-bg"> background.
// roomKey is the PNG filename stem (not always equal to data-room — lobby uses 'corridor').
function wrapRoom(roomKey, svgString){
  return `<img class="room-bg" alt="" loading="lazy"
              src="rooms/${roomKey}_base.png"
              onload="this.classList.add('loaded'); this.parentElement.classList.add('has-bg')"
              onerror="this.classList.add('bg-failed'); this.parentElement.classList.remove('has-bg')">
          ${svgString}`;
}

// Get current preset name from body class (set by applyPreset).
function currentPreset(){
  const c = document.body.classList;
  if(c.contains('preset-terminal')) return 'terminal';
  if(c.contains('preset-cinema'))   return 'cinema';
  if(c.contains('preset-midnight')) return 'midnight';
  return 'cinema'; // default
}

// Swap room PNG to atmosphere-specific override when available, else
// keep base + let CSS filter handle the look. Preloads target src to
// avoid white flash, falls back to base if override 404s.
function syncRoomBackgrounds(preset){
  document.querySelectorAll('.room-bg').forEach(img => {
    const room = img.closest('.room');
    if(!room) return;
    // Determine which roomKey this room is (data-room OR r-lobby → corridor)
    const dataRoom = room.dataset.room;
    const isLobby  = room.classList.contains('r-lobby');
    const roomKey = isLobby ? 'corridor' : dataRoom;
    if(!roomKey) return;

    const hasOverride = (ROOM_OVERRIDES[roomKey] || []).includes(preset);
    const want = hasOverride
      ? `rooms/${roomKey}_${preset}.png`
      : `rooms/${roomKey}_base.png`;
    const currentSrc = img.getAttribute('src') || '';
    if(currentSrc.endsWith(want)) return;

    const pre = new Image();
    pre.onload  = () => { img.src = want; };
    pre.onerror = () => { img.src = `rooms/${roomKey}_base.png`; };
    pre.src = want;
  });
}

// Preload all base PNGs at startup so the first paint isn't blank.
(function preloadBase(){
  TASK8_ROOMS.forEach(r => { const i = new Image(); i.src = `rooms/${r}_base.png`; });
})();

function applyPreset(name, source = 'manual'){
  const dur = source === 'auto' ? 12000 : 0;  // 12s crossfade on auto, instant on manual
  document.body.style.transition = `filter ${dur}ms cubic-bezier(.45,.05,.55,.95)`;
  document.body.classList.remove('preset-terminal','preset-midnight','preset-cinema');
  document.body.classList.add('preset-' + name);
  const s = JSON.parse(localStorage.getItem('yuzu-settings') || '{}');
  s.preset = name;
  s.mode = (source === 'auto') ? 'auto' : 'preset';
  localStorage.setItem('yuzu-settings', JSON.stringify(s));
  applySettings();
  updateAutoBadge();
  syncRoomBackgrounds(name);  // Task 8 — sync PNG overrides when preset changes
}

function scheduleNextSwitch(){
  const s = JSON.parse(localStorage.getItem('yuzu-settings') || '{}');
  if(s.mode !== 'auto') return;
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
  const mins = now.getHours() * 60 + now.getMinutes();
  const next = SCHEDULE.find(p => p.h * 60 + p.m > mins)
              || { ...SCHEDULE[0], h: 24 + SCHEDULE[0].h };
  const msUntil = (next.h * 60 + next.m - mins) * 60000 - now.getSeconds() * 1000;
  setTimeout(() => {
    applyPreset(next.preset, 'auto');
    scheduleNextSwitch();
  }, msUntil);
}

// Compute next scheduled switch, returns { mins, h, m, preset, label }.
// `label` formats as "→ MIDNIGHT 22:00" or "→ TERMINAL 隔日 06:00" if wrapping past midnight.
function nextScheduledSwitch(){
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
  const mins = now.getHours() * 60 + now.getMinutes();
  let next = SCHEDULE.find(p => p.h * 60 + p.m > mins);
  let wraps = false;
  if(!next){ next = SCHEDULE[0]; wraps = true; }
  const pad = (n) => String(n).padStart(2, '0');
  const time = `${pad(next.h)}:${pad(next.m)}`;
  const label = `→ ${next.preset.toUpperCase()} ${wraps ? '隔日 ' : ''}${time}`;
  return { ...next, wraps, time, label };
}

function updateAutoBadge(){
  const s = JSON.parse(localStorage.getItem('yuzu-settings') || '{}');
  const badge = document.getElementById('autoBadge');
  const nameEl = document.getElementById('autoName');
  const nextEl = document.getElementById('autoNext');
  if(!badge) return;
  if(s.mode === 'auto'){
    badge.hidden = false;
    if(nameEl) nameEl.textContent = (s.preset || 'terminal').toUpperCase();
    if(nextEl){
      const n = nextScheduledSwitch();
      nextEl.textContent = ' ' + n.label;
      nextEl.title = `下一次自動切換到 ${n.preset.toUpperCase()} 於 ${n.wraps ? '隔日 ' : ''}${n.time}`;
    }
  } else {
    badge.hidden = true;
  }
}

// Re-sync if tab was backgrounded across a schedule boundary
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){
    const s = JSON.parse(localStorage.getItem('yuzu-settings') || '{}');
    if(s.mode === 'auto'){
      const should = currentScheduledPreset();
      if(should !== s.preset) applyPreset(should, 'auto');
    }
  }
});

// Boot: if mode was 'auto' last session, restart auto from current schedule slot
if(JSON.parse(localStorage.getItem('yuzu-settings') || '{}').mode === 'auto'){
  applyPreset(currentScheduledPreset(), 'auto');
  scheduleNextSwitch();
}

    // SPECIALIST LAYER (middle row)
    {key:'tw_short_term',    x:80,  y:200, label:'TW',             color:'#00C896', tier:'specialist', persona:'tw'},
    {key:'trading_master',   x:220, y:200, label:'TM',             color:'#00E5FF', tier:'specialist', persona:'tm'},
    {key:'portfolio_master', x:360, y:200, label:'PM',             color:'#3D8EFF', tier:'specialist', persona:'pm'},
    {key:'wealth_master',    x:500, y:200, label:'WM',             color:'#A259FF', tier:'specialist', persona:'wm'},
    {key:'devils_advocate',  x:640, y:200, label:'DA',             color:'#FF4560', tier:'specialist', persona:'da'},

    // SYNTHESIS (CIO)
    {key:'master',           x:340, y:340, label:'CIO',            color:'#C9A84C', tier:'synthesis', persona:'cio'},

    {key:'tw_daily_pick',    x:200, y:460, label:"TODAY'S PICK",   color:'#C9A84C', tier:'output'},
    {key:'capital_flow',     x:480, y:460, label:'CAPITAL FLOW',   color:'#C9A84C', tier:'output'},
  ];

  // Edges (from -> to)
  const edges = [
    // Inputs → Specialists
    ['signal_fusion','tw_short_term'], ['signal_fusion','trading_master'], ['signal_fusion','portfolio_master'], ['signal_fusion','wealth_master'],
    ['market_overview','tw_short_term'], ['market_overview','trading_master'], ['market_overview','portfolio_master'],
    ['news_sentiment','tw_short_term'], ['news_sentiment','trading_master'], ['news_sentiment','devils_advocate'],

    // Specialists → CIO
    ['tw_short_term','master'], ['trading_master','master'], ['portfolio_master','master'], ['wealth_master','master'],

    // Devil's Advocate critiques CIO (bidirectional review)
    ['devils_advocate','master'],

    // CIO → Outputs
    ['master','tw_daily_pick'], ['master','capital_flow'],
  ];

  // Get verdict color for each node
  function nodeStatus(key){
    const ag = get(key);
    const v = ag.verdict;
    if(!v) return {state:'idle', col:'var(--text3)', text:'—'};
    if(/error/i.test(v)) return {state:'err', col:'var(--red)', text:'ERR'};
    return {state:'active', col:verdictColor(v), text:v.slice(0,4)};
  }

  // Build SVG
  const w = 760, h = 540;

  const edgePaths = edges.map(([from, to]) => {
    const fn = nodes.find(n=>n.key===from);
    const tn = nodes.find(n=>n.key===to);
    if(!fn || !tn) return '';
    // Bezier curve from bottom of fn to top of tn
    const cx1 = fn.x, cy1 = fn.y + 30;
    const cx2 = tn.x, cy2 = tn.y - 30;
    const midY = (cy1 + cy2) / 2;
    return `<path d="M${fn.x},${fn.y+22} C${cx1},${midY} ${cx2},${midY} ${tn.x},${tn.y-22}"
                  fill="none" stroke="${fn.color}" stroke-width="1.2" stroke-opacity="0.35"
                  stroke-dasharray="4 3"/>`;
  }).join('');

  const nodeShapes = nodes.map(n => {
    const st = nodeStatus(n.key);
    const r = n.tier === 'synthesis' ? 32 : n.tier === 'output' ? 28 : 24;
    const labelSize = n.tier === 'synthesis' ? 11 : 9;
    return `<g class="flow-node" data-key="${n.key}">
      <circle cx="${n.x}" cy="${n.y}" r="${r+4}" fill="${n.color}" opacity="0.12" filter="blur(4px)"/>
      <circle cx="${n.x}" cy="${n.y}" r="${r}" fill="#0A1422" stroke="${st.col}" stroke-width="1.5" opacity="0.95"/>

      <text x="${n.x}" y="${n.y + r + 11}" text-anchor="middle" fill="${st.col}" font-size="8" font-family="monospace" font-weight="700">${st.text}</text>
    </g>`;
  }).join('');

  const tierLabels = `
    <text x="${w-15}" y="62" text-anchor="end" fill="rgba(122,142,189,.4)" font-size="9" font-family="monospace" letter-spacing="2">INPUT LAYER</text>
    <text x="${w-15}" y="202" text-anchor="end" fill="rgba(122,142,189,.4)" font-size="9" font-family="monospace" letter-spacing="2">SPECIALISTS</text>
    <text x="${w-15}" y="342" text-anchor="end" fill="rgba(201,168,76,.5)" font-size="9" font-family="monospace" letter-spacing="2">SYNTHESIS</text>
    <text x="${w-15}" y="462" text-anchor="end" fill="rgba(122,142,189,.4)" font-size="9" font-family="monospace" letter-spacing="2">OUTPUT</text>
    <line x1="40" y1="130" x2="${w-40}" y2="130" stroke="rgba(122,142,189,.1)" stroke-dasharray="2 4"/>
    <line x1="40" y1="270" x2="${w-40}" y2="270" stroke="rgba(122,142,189,.1)" stroke-dasharray="2 4"/>
    <line x1="40" y1="400" x2="${w-40}" y2="400" stroke="rgba(201,168,76,.15)" stroke-dasharray="2 4"/>
  `;

  target.innerHTML = `
    <div class="section-label">DECISION GRAPH · ${nodes.length} NODES · ${edges.length} EDGES</div>
    <div style="font-size:11px;color:var(--text2);line-height:1.7;margin-bottom:14px">
      6 個 agent 與 4 個輔助 component 的決策資料流。
      每個節點顯示**當前 verdict**，連線方向 = 上游餵下游。
      <br>底層 <b style="color:var(--text3)">INPUT</b> → 中層 <b style="color:var(--text3)">SPECIALIST</b> → CIO <b style="color:var(--gold)">SYNTHESIS</b> → <b style="color:var(--text3)">OUTPUT</b>
    </div>

    <div class="card" style="padding:18px">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;max-height:560px;display:block">
        ${tierLabels}
        ${edgePaths}
        ${nodeShapes}
      </svg>
    </div>

    <div class="section-label">CURRENT STATE</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
      ${nodes.filter(n => get(n.key).verdict).map(n => {
        const ag = get(n.key);
        return `<div class="card" style="padding:10px 12px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
            <span style="color:${n.color};font-size:10px;font-weight:800;letter-spacing:1.5px">${n.label}</span>
            <span style="color:${verdictColor(ag.verdict)};font-size:10px;font-weight:700">${ag.verdict||'—'}${ag.confidence?` · ${ag.confidence.toFixed(2)}`:''}</span>
          </div>
          ${ag.summary?`<div style="font-size:10px;color:var(--text2);line-height:1.5">${clip(ag.summary,140)}</div>`:''}
        </div>`;
      }).join('')}
    </div>
  `;
}

function expandRoom(key){
  const cfg = ROOM_RENDERERS[key];
  if(!cfg) return;
  collapseAll();

  const backdrop = document.createElement('div');
  backdrop.className = 'backdrop';
  backdrop.addEventListener('click', collapseAll);
  document.body.appendChild(backdrop);
  activeBackdrop = backdrop;

  const panel = document.createElement('div');
  panel.className = 'expanded';
  panel.dataset.room = key;
  panel.innerHTML = `
    <div class="exp-header">
      <div>
        <div class="exp-title">${cfg.title}</div>
        <div class="exp-sub">${cfg.sub}</div>
      </div>
      <button class="exp-close">✕  RETURN TO FLOOR</button>
    </div>
    <div id="exp-body"></div>
  `;
  document.body.appendChild(panel);
  panel.querySelector('.exp-close').addEventListener('click', collapseAll);
  cfg.render($('exp-body'));

  $('iso-grid').classList.add('zoomed');
  $('crumb').innerHTML = `<span class="crumb-back">YUZU CAPITAL</span> · <span class="crumb-room">${cfg.title}</span>`;
  const back = $('crumb').querySelector('.crumb-back');
  if(back) back.addEventListener('click', collapseAll);

  // sync left nav active
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.target === key);
  });

  // Update URL for deep linking
  history.replaceState({}, '', '?room=' + key);

  activeRoom = panel;
}

function collapseAll(){
  if(activeRoom){activeRoom.remove(); activeRoom = null}
  if(activeBackdrop){activeBackdrop.remove(); activeBackdrop = null}
  $('iso-grid').classList.remove('zoomed');
  $('crumb').innerHTML = '<span class="crumb-room">YUZU CAPITAL · OVERVIEW</span>';
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.target === 'overview');
  });
  // Clean URL
  if(window.location.search) history.replaceState({}, '', window.location.pathname);
}

function expandSystem(key){
  const cfg = SYSTEM_RENDERERS[key];
  if(!cfg) return;
  collapseAll();

  const backdrop = document.createElement('div');
  backdrop.className = 'backdrop';
  backdrop.addEventListener('click', collapseAll);
  document.body.appendChild(backdrop);
  activeBackdrop = backdrop;

  const panel = document.createElement('div');

  panel.dataset.system = key;
  panel.innerHTML = `
    <div class="exp-header">
      <div>
        <div class="exp-title">${cfg.title}</div>
        <div class="exp-sub">SYSTEM · ${cfg.sub}</div>
      </div>
      <button class="exp-close">✕  CLOSE</button>
    </div>
    <div id="exp-body"></div>
  `;

// Wire navigation + stubs + ESC
// ═══════════════════════════════════════════════════════════════════
function wireNav(){
  document.querySelectorAll('.nav-item').forEach(n => {
    n.addEventListener('click', () => {
      const target = n.dataset.target;
      const stub = n.dataset.stub;
      const system = n.dataset.system;
      if(stub){
        showToast(`${stub} · 預計於後續 phase 推出`);
        return;
      }
      if(system && SYSTEM_RENDERERS[system]){
        expandSystem(system);
        return;
      }
      if(target === 'overview'){
        collapseAll();
      } else if(ROOM_RENDERERS[target]){
        expandRoom(target);
      }
    });
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && activeRoom) collapseAll();
  });
}

// URL routing: ?room=trading or ?system=decision-log
function applyURLRoute(){
  const p = new URLSearchParams(window.location.search);
  const room = p.get('room');
  const system = p.get('system');
  if(room && ROOM_RENDERERS[room]) expandRoom(room);
  else if(system && SYSTEM_RENDERERS[system]) expandSystem(system);
}

let toastTimer;
function showToast(msg){
  const old = document.querySelector('.toast');
  if(old) old.remove();
  clearTimeout(toastTimer);
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  toastTimer = setTimeout(() => el.remove(), 2500);
}

const CACHE_KEY = 'yuzu-data-cache';
const CACHE_TTL_MS = 24 * 60 * 60 * 1000;  // 24 hours

function loadFromCache(){
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const c = JSON.parse(raw);
    if(Date.now() - c.t > CACHE_TTL_MS) return null;
    return c;
  } catch(_) { return null; }
}

function saveToCache(){
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({t:Date.now(), data:DATA, cands:CANDS}));
  } catch(_) {}
}

function renderAll(){
  applySettings();
  renderTopbar();
  renderOffice();
  renderSidebar();
}

async function load(){
  // Phase 1: render cached data instantly (if available)
  const cache = loadFromCache();
  if(cache){
    DATA = cache.data;
    CANDS = cache.cands;
    renderAll();
    wireNav();
    applyURLRoute();
    // Subtle banner indicating cache mode
    showStaleBanner(cache.t);
  }

  // Phase 2: fetch fresh data in background
  try {
    const [r1, r2, r3, r4] = await Promise.all([
      fetch('data/analysis.json?t=' + Date.now()),
      fetch('data/candidate_stocks.json?t=' + Date.now()).catch(() => null),
      fetch('data/errors.log?t=' + Date.now()).catch(() => null),
      fetch('data/signal_history.jsonl?t=' + Date.now()).catch(() => null),
    ]);
    // Parse errors.log (JSONL) — keep newest 5 entries
    LATEST_ERRORS = [];
    if(r3 && r3.ok){
      try {
        const text = await r3.text();
        LATEST_ERRORS = text.trim().split(/\r?\n/).filter(Boolean).slice(-5).map(l => {
          try { return JSON.parse(l); } catch { return null; }
        }).filter(Boolean).reverse();
      } catch { LATEST_ERRORS = []; }
    }
    // Parse signal_history.jsonl — keep last 60 entries (~30 trading days × 2 runs)
    SIGNAL_HISTORY = [];
    if(r4 && r4.ok){
      try {
        const text = await r4.text();
        SIGNAL_HISTORY = text.trim().split(/\r?\n/).filter(Boolean).slice(-60).map(l => {
          try { return JSON.parse(l); } catch { return null; }
        }).filter(Boolean);
      } catch { SIGNAL_HISTORY = []; }
    }
    if(!r1.ok) throw new Error(`analysis.json HTTP ${r1.status}`);
    const freshData = await r1.json();
    let freshCands = null;
    if(r2 && r2.ok){
      try { freshCands = await r2.json(); } catch(_){ freshCands = null; }
    }
    // Only re-render if data is newer
    if(!DATA || freshData.generated_at !== DATA.generated_at){
      DATA = freshData;
      CANDS = freshCands;
      saveToCache();
      if(cache) {
        // Re-render with fresh data (preserve open room/system if any)
        const cur = window.location.search;
        renderAll();
        wireNav();
        if(cur) applyURLRoute();
        hideStaleBanner();
      } else {
        renderAll();
        wireNav();
        applyURLRoute();
      }
    } else {
      hideStaleBanner();
    }
  } catch(e){
    if(!cache){
      document.body.insertAdjacentHTML('afterbegin', `<div class="err-msg">資料載入失敗：${e.message}</div>`);
    } else {
      // Have cache, fetch failed — show cached but stale
      showStaleBanner(cache.t, true);
    }
  }
}

function showStaleBanner(timestamp, fetchFailed=false){
  document.getElementById('stale-banner')?.remove();
  const el = document.createElement('div');
  el.id = 'stale-banner';
  const ageMin = Math.floor((Date.now() - timestamp) / 60000);
  const ageStr = ageMin < 60 ? `${ageMin}m` : `${Math.floor(ageMin/60)}h${ageMin%60}m`;
  el.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid '+(fetchFailed?'var(--orange)':'var(--yellow)')+';color:'+(fetchFailed?'var(--orange)':'var(--yellow)')+';padding:7px 16px;border-radius:5px;font-size:10px;letter-spacing:1px;z-index:200;font-family:monospace;box-shadow:0 6px 20px rgba(0,0,0,.5)';
  el.textContent = fetchFailed ? `⚠ OFFLINE · 顯示 ${ageStr} 前快取資料` : `↻ LOADING FRESH DATA · 暫顯 ${ageStr} 前快取`;
  document.body.appendChild(el);
}

function hideStaleBanner(){
  const el = document.getElementById('stale-banner');
  if(!el) return;
  el.style.transition = 'opacity .4s';
  el.style.opacity = '0';
  setTimeout(() => el.remove(), 400);
}

load();

// ═══════════════════════════════════════════════════════════════════
// Patch ① — Agent breathing (Web Animations API, reliable on SVG <g>)
// CSS @keyframes on SVG groups don't trigger reflow consistently on
// Chromium when nested inside transformed parents. Element.animate() works.
// ═══════════════════════════════════════════════════════════════════
// Peak values bumped 2-3x from initial design (which was too subtle to perceive
// at small character render size). Now visible but still "low frequency".
const BREATH_PRESETS = {
  cio:       {dur:6800, hold:true,  peak:1.028, halo:{dur:11200, peakOpacity:.28}, delayBody:-1700, delayHalo:-2800},
  tm:        {dur:4200, hold:false, peak:1.038, halo:{dur:6400,  peakOpacity:.34}, delayBody:-1300, delayHalo:-3100},
  tw:        {dur:5000, hold:true,  peak:1.030, halo:{dur:7800,  peakOpacity:.28}, delayBody:-2700, delayHalo:-4400},
  da:        {dur:7400, hold:true,  peak:1.025, halo:{dur:9400,  peakOpacity:.24}, delayBody:-3900, delayHalo:-700},
  pm:        {dur:6400, hold:false, peak:1.028, halo:{dur:10000, peakOpacity:.26}, delayBody:-2300, delayHalo:-5300},
  wm:        {dur:8200, hold:true,  peak:1.022, halo:{dur:13400, peakOpacity:.24}, delayBody:-5900, delayHalo:-8100},
  concierge: {dur:6800, hold:true,  peak:1.028, halo:{dur:11200, peakOpacity:.28}, delayBody:-4900, delayHalo:-7300},
};

// rAF-driven breathing. SVG <g> ignores CSS animation + Web Animations API
// for transform property — direct attribute manipulation is the only reliable path.
let _breathRAF = null;
function startBreathing(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if(_breathRAF) return;  // single loop drives all agents

  const t0 = performance.now();
  // Smooth ease (cubic bezier approximation via sine)
  const smooth = u => (1 - Math.cos(u * Math.PI)) / 2;  // 0→1 with ease

  function curve(t, peak, hold){
    // t: 0..1 phase. Returns scale value.
    if(hold){
      if(t < .42) return 1 + (peak - 1) * smooth(t / .42);
      if(t < .58) return peak;
      return 1 + (peak - 1) * smooth((1 - t) / .42);
    }
    return 1 + (peak - 1) * Math.sin(t * Math.PI);
  }

  function tick(now){
    document.querySelectorAll('.agent-v3').forEach(el => {
      const role = Array.from(el.classList).find(c => BREATH_PRESETS[c]);
      if(!role) return;
      const p = BREATH_PRESETS[role];

      // Body breathing — phase in [0,1)
      const phase = (((now - t0) - p.delayBody) % p.dur) / p.dur;
      const scale = curve(phase, p.peak, p.hold);
      el.setAttribute('transform', `scale(${scale.toFixed(4)})`);

      // Halo opacity — separate phase (out of sync)
      const halo = el.querySelector('.ag-halo');
      if(halo){
        const hPhase = (((now - t0) - p.delayHalo) % p.halo.dur) / p.halo.dur;
        const op = .13 + (p.halo.peakOpacity - .13) * Math.sin(hPhase * Math.PI);
        halo.setAttribute('opacity', Math.max(.13, op).toFixed(3));
      }
    });
    _breathRAF = requestAnimationFrame(tick);
  }
  _breathRAF = requestAnimationFrame(tick);
}

// Start the breathing rAF loop once. The tick function re-queries .agent-v3
// every frame, so newly added agents (after data refresh / re-render) auto-pick-up.
// rAF pauses when tab is hidden — that's correct behavior (no animation needed
// when user isn't looking).
startBreathing();

// ═══════════════════════════════════════════════════════════════
// CORRIDOR WALKING SYSTEM (Task 1)
// Agents occasionally drift out of their rooms, walk a path through the
// corridor, then return. Single global walker, generous cooldowns, opt-in
// triggers — designed to feel like a ritual, not a loop.
// ═══════════════════════════════════════════════════════════════

const WALKS = {
  cio: { path:"M180,200 L180,215 L400,215 L400,90 L220,90 L220,200",
         dur:5600, ease:"cubic-bezier(.4,0,.4,1)",
         color:"#C9A84C", cd:180000, from:"exec" },
  da:  { path:"M180,320 L180,335 L295,335 L295,340",
         dur:4200, ease:"cubic-bezier(.4,.1,.8,.5)",
         color:"#FF4560", cd:75000,  from:"risk" },
  tw:  { path:"M620,200 L620,215 L410,215 L410,200",
         dur:5800, ease:"cubic-bezier(.4,0,.4,1)",
         color:"#00C896", cd:90000,  from:"research" },
  tm:  { path:"M295,340 L295,335 L510,335 L520,338",
         dur:4800, ease:"linear",
         color:"#00E5FF", cd:120000, from:"trading" },
  pm:  { path:"M400,220 L400,215 L510,215 L510,270 L520,270",
         dur:5200, ease:"cubic-bezier(.3,0,.3,1)",
         color:"#3D8EFF", cd:90000,  from:"wealth" },
  wm:  { path:"M400,220 L400,215 L220,215 L220,200",
         dur:5000, ease:"cubic-bezier(.5,.1,.3,1)",
         color:"#A259FF", cd:100000, from:"wealth" },
};

const walkState = { active:null, lastEnd:-Infinity, lastByAgent:{} };

function ensureWalker(){
  let dot = document.getElementById('walker');
  if(dot) return dot;
  const grid = document.querySelector('.iso-grid');
  if(!grid) return null;
  dot = document.createElement('div');
  dot.id = 'walker';
  grid.appendChild(dot);
  return dot;
}

function tryWalk(agent){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
  const w = WALKS[agent];
  if(!w) return false;
  const now = performance.now();
  if(walkState.active) return false;                         // global lock
  if(now - walkState.lastEnd < 90000) return false;          // 90s global spacing
  const lastAgent = walkState.lastByAgent[agent];
  if(lastAgent != null && now - lastAgent < w.cd) return false;
  // Source room must exist in current DOM
  if(!document.querySelector(`.room[data-room="${w.from}"]`)) return false;
  startWalk(agent);
  return true;
}

function startWalk(agent){
  const w = WALKS[agent];
  const dot = ensureWalker();
  if(!dot) return;
  walkState.active = agent;
  document.querySelector(`.room[data-room="${w.from}"]`)?.classList.add('ghosting');
  dot.style.offsetPath = `path("${w.path}")`;
  dot.style.offsetDistance = '0%';
  dot.style.setProperty('--walker-color', w.color);
  dot.style.display = 'block';
  dot.animate(
    [{ offsetDistance:'0%' }, { offsetDistance:'100%' }],
    { duration:w.dur, easing:w.ease, fill:'forwards' }
  ).onfinish = () => arriveAndReturn(agent);
}

function arriveAndReturn(agent){
  const w = WALKS[agent];
  const dot = document.getElementById('walker');
  setTimeout(() => {
    if(!dot){ finishWalk(agent); return; }
    dot.animate(
      [{ offsetDistance:'100%' }, { offsetDistance:'0%' }],
      { duration:w.dur, easing:w.ease, fill:'forwards' }
    ).onfinish = () => finishWalk(agent);
  }, 2500);
}

function finishWalk(agent){
  const w = WALKS[agent];
  const dot = document.getElementById('walker');
  if(dot) dot.style.display = 'none';
  document.querySelector(`.room[data-room="${w.from}"]`)?.classList.remove('ghosting');
  walkState.active = null;
  walkState.lastEnd = performance.now();
  walkState.lastByAgent[agent] = performance.now();
}

// ═══════════════════════════════════════════════════════════════════
// Patch ④ — Workflow Replay on Hover (TW → DA → CIO light flow)
// ═══════════════════════════════════════════════════════════════════
function runReplay(card){
  const pulse = card.querySelector('.r-pulse');
  const p1 = card.querySelector('.p1');
  const p2 = card.querySelector('.p2');
  const labelTW  = card.querySelector('.r-agent-label.tw');
  const labelDA  = card.querySelector('.r-agent-label.da');
  const labelCIO = card.querySelector('.r-agent-label.cio');
  if(!pulse) return;

  const DUR = 2500;  // total ms
  const leg1 = [[100,120],[200,90],[300,120]];   // TW → DA (quadratic bezier control pts)
  const leg2 = [[300,120],[400,150],[500,120]];  // DA → CIO

  function alongQ(el, pts, duration){
    const start = performance.now();
    function tick(now){
      const e = Math.min(1, (now-start)/duration);
      const u = 1-e;
      const x = u*u*pts[0][0] + 2*u*e*pts[1][0] + e*e*pts[2][0];
      const y = u*u*pts[0][1] + 2*u*e*pts[1][1] + e*e*pts[2][1];
      el.setAttribute('cx', x);
      el.setAttribute('cy', y);
      if(e<1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // Sequence: label TW on → light TW→DA → label DA on → light DA→CIO → label CIO on → fadeout
  setTimeout(() => { labelTW?.classList.add('on'); pulse.style.opacity = 1; p1.classList.add('warm'); alongQ(pulse, leg1, DUR*.32); }, DUR*.08);
  setTimeout(() => { labelDA?.classList.add('on'); p2.classList.add('warm'); alongQ(pulse, leg2, DUR*.32); }, DUR*.44);
  setTimeout(() => { labelCIO?.classList.add('on'); }, DUR*.76);
  setTimeout(() => {
    pulse.style.opacity = 0;
    p1.classList.remove('warm'); p2.classList.remove('warm');
    labelTW?.classList.remove('on'); labelDA?.classList.remove('on'); labelCIO?.classList.remove('on');
  }, DUR*.96);
}

document.addEventListener('mouseover', (e) => {
  const card = e.target.closest('[data-replay]');
  if(card && !card._replayRunning){
    card._replayRunning = true;
    runReplay(card);
    setTimeout(() => { card._replayRunning = false; }, 2700);
  }
});

// Patch ⑤ — Demo Mode 守夜 (30s idle → screensaver replay)
// ═══════════════════════════════════════════════════════════════════
const DEMO = {
  IDLE_MS: 30000,
  FADE_IN_MS: 1500,
  PLAYING_MS: 5500,
  FADE_OUT_MS: 1200,
  COOL_MIN: 22000,
  COOL_MAX: 28000,
};
let demoState = 'idle';
let demoTimer = null;

function setDemoState(s){
  clearTimeout(demoTimer);
  demoState = s;
  if(s === 'idle'){
    document.body.classList.remove('demo-mode');
    demoTimer = setTimeout(() => setDemoState('fade-in'), DEMO.IDLE_MS);
  } else if(s === 'fade-in'){
    document.body.classList.add('demo-mode');
    demoTimer = setTimeout(() => setDemoState('playing'), DEMO.FADE_IN_MS);
  } else if(s === 'playing'){
    const card = document.querySelector('.pick-summary[data-replay]');
    if(card) runReplay(card);
    demoTimer = setTimeout(() => setDemoState('fade-out'), DEMO.PLAYING_MS);
  } else if(s === 'fade-out'){
    document.body.classList.remove('demo-mode');
    demoTimer = setTimeout(() => setDemoState('cooldown'), DEMO.FADE_OUT_MS);
  } else if(s === 'cooldown'){
    const wait = DEMO.COOL_MIN + Math.random() * (DEMO.COOL_MAX - DEMO.COOL_MIN);
    demoTimer = setTimeout(() => setDemoState('fade-in'), wait);
  }
}

function resetIdle(){
  if(demoState === 'fade-in' || demoState === 'playing'){
    setDemoState('fade-out');
  } else if(demoState === 'cooldown'){
    setDemoState('idle');
  }
  // If already idle, the existing timer keeps counting — no reset needed
  // since user activity during idle just delays the trigger naturally
  // via the IDLE_MS countdown restart below:
  if(demoState === 'idle'){
    clearTimeout(demoTimer);
    demoTimer = setTimeout(() => setDemoState('fade-in'), DEMO.IDLE_MS);
  }
}

// MOBILE · Horizontal snap rail — IntersectionObserver picks focused room
// ═══════════════════════════════════════════════════════════════
function attachMobileSnap(){
  if(window.innerWidth >= 900) return null;
  const grid = document.querySelector('.iso-grid');
  if(!grid) return null;
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.intersectionRatio > 0.55){
        document.querySelectorAll('.room').forEach(r => r.classList.remove('m-focus'));
        e.target.classList.add('m-focus');
        document.dispatchEvent(new CustomEvent('room-focus', { detail: e.target.dataset.room }));
      }
    });
  }, { root: grid, threshold: [0.55, 0.85] });
  document.querySelectorAll('.room').forEach(r => io.observe(r));
  setupSnapHint(grid);
  return io;
}

// First-run swipe hint for the mobile horizontal rail.
// Fades out on first scroll/touch and remembers dismissal in localStorage.
const SNAP_HINT_STORAGE = 'yuzu-snap-hint-dismissed';
function setupSnapHint(grid){
  const hint = document.getElementById('snap-hint');
  if(!hint) return;
  if(localStorage.getItem(SNAP_HINT_STORAGE) === '1') return;
  // Show after a short pause so it doesn't fight with initial paint
  setTimeout(() => hint.classList.add('show'), 450);
  const dismiss = () => {
    hint.classList.remove('show');
    try { localStorage.setItem(SNAP_HINT_STORAGE, '1'); } catch {}
    grid.removeEventListener('scroll', onScroll, { passive: true });
    grid.removeEventListener('touchstart', dismiss, { passive: true });
  };
  let scrolled = 0;
  const onScroll = () => { scrolled++; if(scrolled > 1) dismiss(); };
  grid.addEventListener('scroll', onScroll, { passive: true });
  grid.addEventListener('touchstart', dismiss, { passive: true });
}
let _mobileSnap = attachMobileSnap();

// Re-attach on resize crossing the breakpoint or after each iso-grid re-render
window.addEventListener('resize', () => {
  if(_mobileSnap){ _mobileSnap.disconnect(); _mobileSnap = null; }
  _mobileSnap = attachMobileSnap();
});
document.addEventListener('iso-rendered', () => {
  if(_mobileSnap){ _mobileSnap.disconnect(); _mobileSnap = null; }
  _mobileSnap = attachMobileSnap();
});

      el.className = 'counsel-msg agent';
      el.dataset.agent = m.agent;
      el.innerHTML = `<span class="agent-tag" style="color:${color}; border:1px solid ${color}55">${name}</span>
                      <div class="msg-text"></div>`;
      const txt = el.querySelector('.msg-text');
      txt.appendChild(document.createTextNode(m.text || ''));
      for(const ref of (m.cites || [])){
        const chip = document.createElement('span');
        chip.className = 'cite';
        chip.dataset.cite = ref;
        chip.textContent = ref;
        txt.appendChild(chip);
        txt.appendChild(document.createTextNode(' '));
      }
      body.appendChild(el);
    }
  }
}

function buildCounselDOM(){
  const root = document.createElement('div');
  root.innerHTML = `
    <div class="counsel-backdrop"></div>
    <div class="counsel-panel" role="dialog" aria-label="Yuzu Counsel">
      <div class="counsel-header">
        <div>
          <div class="counsel-title">YUZU COUNSEL</div>
          <div class="counsel-sub">Ask the desk · ⌘K to toggle · ESC to close</div>
        </div>
        <div style="display:flex; align-items:center">
          <span class="counsel-mock-badge" title="MOCK: replies derived from analysis.json locally. Set a Gemini key to switch to LIVE.">MOCK</span>
          <button class="counsel-key" title="Set/clear Gemini API key (stored only in your browser)">🔑 KEY</button>
          <button class="counsel-clear hidden" title="Clear conversation">CLEAR</button>
          <button class="counsel-close">✕ CLOSE</button>
        </div>
      </div>
      <div class="counsel-body"></div>
      <div class="counsel-suggestions"></div>
      <div class="counsel-input">
        <textarea rows="1" placeholder="例如：2536 為什麼還沒停損？" autocomplete="off"></textarea>
        <button class="counsel-send">↑ SEND</button>
      </div>
    </div>
  `;
  const frag = document.createDocumentFragment();
  while(root.firstChild) frag.appendChild(root.firstChild);
  const wrap = document.createElement('div');
  wrap.appendChild(frag);

  wrap.querySelector('.counsel-backdrop').addEventListener('click', closeCounsel);
  wrap.querySelector('.counsel-close').addEventListener('click', closeCounsel);
  wrap.querySelector('.counsel-key').addEventListener('click', promptForGeminiKey);

  const ta = wrap.querySelector('textarea');
  const send = wrap.querySelector('.counsel-send');
  const body = wrap.querySelector('.counsel-body');
  const suggestions = wrap.querySelector('.counsel-suggestions');
  const clearBtn = wrap.querySelector('.counsel-clear');
  refreshCounselBadge(wrap);

  // Clear button — wipes localStorage + resets to greeting + suggestions
  clearBtn.addEventListener('click', () => {
    if(counselHistory.length > 0 && !confirm('清除目前對話歷史？這個動作無法復原。')) return;
    clearCounselHistory();
    clearBtn.classList.add('hidden');
    body.innerHTML = `
      <div class="counsel-msg agent" data-agent="cio">
        <span class="agent-tag" style="color:#C9A84C; border:1px solid rgba(201,168,76,.4)">CIO</span>
        <div class="msg-text">已清空。問我任何今天 desk 的判斷，或某檔股票該如何處理。</div>
      </div>`;
    const qs = buildSuggestions();
    suggestions.innerHTML = qs.map(q =>
      `<button class="counsel-suggestion">${q}</button>`
    ).join('');
    suggestions.classList.remove('hidden');
  });

  // Restore from localStorage if recent history exists
  const persisted = loadCounselHistory();
  if(persisted && persisted.length > 0){
    counselHistory = persisted;
    renderHistoryToBody(body, persisted);
    clearBtn.classList.remove('hidden');
    suggestions.classList.add('hidden');
  } else {
    // Fresh greeting + suggestions
    body.innerHTML = `
      <div class="counsel-msg agent" data-agent="cio">
        <span class="agent-tag" style="color:#C9A84C; border:1px solid rgba(201,168,76,.4)">CIO</span>
        <div class="msg-text">早安。問我任何今天 desk 的判斷，或某檔股票該如何處理。我會把相關的 agents 拉進來一起回答。</div>
      </div>`;
    const qs = buildSuggestions();
    suggestions.innerHTML = qs.map(q =>
      `<button class="counsel-suggestion">${q}</button>`
    ).join('');
  }

  // Suggestion click → fill textarea + auto-send
  suggestions.addEventListener('click', (e) => {
    const btn = e.target.closest('.counsel-suggestion');
    if(!btn) return;
    ta.value = btn.textContent;
    autoresize();
    trySend();
  });

  // Clear → wipe history + restore greeting + suggestions
  clearBtn.addEventListener('click', () => {
    clearCounselHistory();
    body.innerHTML = `
      <div class="counsel-msg agent" data-agent="cio">
        <span class="agent-tag" style="color:#C9A84C; border:1px solid rgba(201,168,76,.4)">CIO</span>
        <div class="msg-text">早安。問我任何今天 desk 的判斷，或某檔股票該如何處理。我會把相關的 agents 拉進來一起回答。</div>
      </div>`;
    const qs = buildSuggestions();
    suggestions.innerHTML = qs.map(q =>
      `<button class="counsel-suggestion">${q}</button>`
    ).join('');
    suggestions.classList.remove('hidden');
    clearBtn.classList.add('hidden');
  });

  function autoresize(){
    ta.style.height = '36px';
    ta.style.height = Math.min(120, ta.scrollHeight) + 'px';
  }
  ta.addEventListener('input', autoresize);

  function trySend(){
    const q = ta.value.trim();
    if(!q || counselBusy) return;
    ta.value = ''; autoresize();
    // Hide suggestions once user has asked anything this round
    suggestions.classList.add('hidden');
    clearBtn.classList.remove('hidden');
    submitQuestion(q, body);
  }
  send.addEventListener('click', trySend);
  ta.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); trySend(); }
  });

  return wrap;
}

async function submitQuestion(question, body){
  counselBusy = true;
  document.querySelector('.counsel-send')?.setAttribute('disabled', 'true');

  // User bubble + persist
  const userMsg = document.createElement('div');
  userMsg.className = 'counsel-msg user';
  userMsg.textContent = question;
  body.appendChild(userMsg);
  body.scrollTop = body.scrollHeight;
  counselHistory.push({ role:'user', text: question });
  saveCounselHistory();
  // Reveal CLEAR button now that there's something to clear
  document.querySelector('.counsel-clear')?.classList.remove('hidden');

  // Holds the data we accumulate per agent so we can persist on completion
  let currentMsg = null;
  let currentRecord = null;
  let currentDotsEl = null;

  await askCounsel(question, {
    onAgent: (evt) => {
      const card = (typeof AGENT_CARDS !== 'undefined') ? AGENT_CARDS[evt.agent] : null;
      const color = card?.color || '#7A8EBD';
      const name = card?.name || evt.agent.toUpperCase();
      currentMsg = document.createElement('div');
      currentMsg.className = 'counsel-msg agent';
      currentMsg.dataset.agent = evt.agent;
      currentMsg.innerHTML = `
        <span class="agent-tag" style="color:${color}; border:1px solid ${color}55">${name}</span>
        <div class="msg-text"><span class="thinking-dots">⋯⋯⋯</span></div>`;
      body.appendChild(currentMsg);
      currentDotsEl = currentMsg.querySelector('.thinking-dots');
      currentRecord = { role:'agent', agent: evt.agent, text:'', cites: [] };
      counselHistory.push(currentRecord);
      body.scrollTop = body.scrollHeight;
    },
    onToken: (evt) => {
      if(!currentMsg) return;
      // First token removes the dots
      if(currentDotsEl){ currentDotsEl.remove(); currentDotsEl = null; }
      const txt = currentMsg.querySelector('.msg-text');
      txt.insertAdjacentText('beforeend', evt.text);
      if(currentRecord) currentRecord.text += evt.text;
      body.scrollTop = body.scrollHeight;
    },
    onCite: (evt) => {
      if(!currentMsg) return;
      if(currentDotsEl){ currentDotsEl.remove(); currentDotsEl = null; }
      const txt = currentMsg.querySelector('.msg-text');
      const chip = document.createElement('span');
      chip.className = 'cite';
      chip.dataset.cite = evt.ref;
      chip.textContent = evt.ref;
      txt.appendChild(chip);
      txt.insertAdjacentText('beforeend', ' ');
      if(currentRecord) currentRecord.cites.push(evt.ref);
    },
    onDone: () => {
      saveCounselHistory();
    },
  });

  counselBusy = false;
  document.querySelector('.counsel-send')?.removeAttribute('disabled');
  saveCounselHistory();
}

// askCounsel — dispatcher

const GEMINI_KEY_STORAGE = 'yuzu-gemini-key';
const GEMINI_MODEL = 'gemini-2.5-flash';

function getGeminiKey(){
  try { return (localStorage.getItem(GEMINI_KEY_STORAGE) || '').trim(); } catch { return ''; }
}
function setGeminiKeyValue(k){
  try {
    if(k) localStorage.setItem(GEMINI_KEY_STORAGE, k.trim());
    else  localStorage.removeItem(GEMINI_KEY_STORAGE);
  } catch {}
}
function promptForGeminiKey(){
  const cur = getGeminiKey();
  const note = '輸入 Gemini API key（從 aistudio.google.com/apikey 取得，免費）。\n' +
               'Key 只存在你的瀏覽器 localStorage，不會送到任何地方。\n' +
               '清空欄位後按確定 → 切回 MOCK mode。';
  const input = prompt(note, cur);
  if(input === null) return; // cancelled
  setGeminiKeyValue(input);
  refreshCounselBadge();
}
function refreshCounselBadge(root){
  const badge = (root || document).querySelector('.counsel-mock-badge');
  if(!badge) return;
  const live = !!getGeminiKey();
  badge.textContent = live ? 'LIVE' : 'MOCK';
  badge.classList.toggle('live', live);
  badge.title = live
    ? `LIVE: streaming from Gemini ${GEMINI_MODEL} via your key. Click 🔑 KEY to clear.`
    : 'MOCK: replies derived from analysis.json locally. Click 🔑 KEY to add a Gemini key for LIVE mode.';
}

// ─── Real Gemini SSE streaming (browser → Gemini direct) ──────
async function* streamGemini(systemPrompt, userText, apiKey){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:streamGenerateContent?alt=sse&key=${encodeURIComponent(apiKey)}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: systemPrompt }] },
      contents: [{ role: 'user', parts: [{ text: userText }] }],
    }),
  });
  if(!res.ok){
    const errText = await res.text().catch(() => '');
    throw new Error(`Gemini ${res.status}: ${errText.slice(0, 200)}`);
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while(true){
    const { done, value } = await reader.read();
    if(done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    // SSE events are split by blank line; each event has a "data: {...}" line
    while((idx = buf.indexOf('\n\n')) !== -1){
      const event = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      const dataLine = event.split('\n').find(l => l.startsWith('data:'));
      if(!dataLine) continue;
      const json = dataLine.slice(5).trim();
      if(!json || json === '[DONE]') continue;
      try {
        const obj = JSON.parse(json);
        const text = obj?.candidates?.[0]?.content?.parts?.[0]?.text;
        if(text) yield text;
      } catch { /* tolerate malformed events */ }
    }
  }
}

function buildCounselContext(ctx){
  const a = ctx.agents || {};
  const r = ctx.regime || {};

  const pickInfo = (pick && pick.code && pick.code !== '—')
    ? `${pick.name}(${pick.code}) entry ${pick.entry_zone}, stop ${pick.stop_loss}, target ${pick.target}`
    : '空手觀望（無 pick）';
  const fmt = (v) => (typeof v === 'number' ? v.toFixed(2) : (v || '—'));
  return {
    regime:    r.market_regime || '—',
    riskLevel: r.risk_level || '—',
    masterV:   a.master?.verdict || '—',
    pmV:       a.portfolio_master?.verdict || '—',
    daV:       a.devils_advocate?.verdict || '—',
    tmV:       a.trading_master?.verdict || '—',
    twV:       a.tw_short_term?.verdict || '—',
    wmV:       a.wealth_master?.verdict || '—',

    breadth:         fmt(sv.breadth_score),
    liquidity:       a.wealth_master?.liquidity_risk || '—',
    cashflow:        a.wealth_master?.cashflow_stability || '—',
  };
}

${brief.task}

// ─── Dispatcher ───────────────────────────────────────────────
async function askCounsel(question, handlers = {}){
  const key = getGeminiKey();
  return key
    ? askCounselLive(question, handlers, key)
    : askCounselMock(question, handlers);
}

async function askCounselLive(question, { onAgent, onToken, onCite, onDone } = {}, apiKey){
  const ctx = window.DATA || {};
  const agents = pickRelevantAgents(question);
  for(const agent of agents){
    onAgent?.({ type:'agent-start', agent });
    const sys = buildAgentSystemPrompt(agent, ctx);
    let full = '';
    try {
      for await (const chunk of streamGemini(sys, question, apiKey)){
        full += chunk;
        onToken?.({ type:'token', agent, text:chunk });
      }
    } catch (err) {
      const msg = ` [${err.message.slice(0, 120)}]`;
      onToken?.({ type:'token', agent, text:msg });
      full += msg;
    }
    // Cites: pull up to 2 distinct 4-digit codes, else fall back to VERDICT
    const codes = Array.from(new Set((full.match(/\b\d{4}\b/g) || []))).slice(0, 2);
    const cites = codes.length > 0
      ? codes.map(c => `${agent.toUpperCase()}·${c}`)
      : [`${agent.toUpperCase()}·VERDICT`];
    for(const c of cites){ onCite?.({ type:'cite', agent, ref:c }); await sleep(60); }
    await sleep(200);
  }
  onDone?.({ type:'done' });
}

async function askCounselMock(question, { onAgent, onToken, onCite, onDone } = {}){
  const ctx = window.DATA || {};
  const agents = pickRelevantAgents(question);
  for(const agent of agents){
    onAgent?.({ type:'agent-start', agent });
    const reply = generateMockReply(agent, question, ctx);
    const chunks = chunkText(reply.text, 4 + Math.floor(Math.random()*4));
    for(const c of chunks){
      onToken?.({ type:'token', agent, text:c });
      await sleep(28 + Math.random()*22);
    }
    for(const cite of reply.cites){
      onCite?.({ type:'cite', agent, ref:cite });
      await sleep(60);
    }
    await sleep(220);
  }
  onDone?.({ type:'done' });
}

function pickRelevantAgents(q){
  const s = q;
  if(/停損|斷頭|止損|cut/i.test(s))                return ['pm', 'da', 'cio'];
  if(/進場|買進|加碼|追擊|breakout/i.test(s))        return ['tm', 'tw', 'cio'];
  if(/市場|大盤|體制|regime/i.test(s))               return ['pm', 'cio'];
  if(/風險|風控|worst|下行/i.test(s))                return ['da', 'wm', 'cio'];
  if(/配置|資產|多空|allocation/i.test(s))           return ['pm', 'wm', 'cio'];
  if(/流動|現金|cash/i.test(s))                     return ['wm', 'cio'];
  if(/今日|today|現況/i.test(s))                    return ['tm', 'da', 'cio'];
  return ['pm', 'da', 'cio'];  // default trio
}

function generateMockReply(agent, question, ctx){
  const key = AGENT_DATA_KEYS[agent];
  const a = (ctx.agents || {})[key] || {};
  const pick = (ctx.agents?.tw_daily_pick?.pick) || {};
  const regime = ctx.regime?.market_regime || '—';
  const verdict = a.verdict || '—';

  // Detect 4-digit stock code in question for cite targeting
  const codeMatch = question.match(/\b\d{4}\b/);
  const code = codeMatch ? codeMatch[0] : (pick.code && pick.code !== '—' ? pick.code : null);

  // Pull first non-trivial sentence from agent summary
  const summary = (a.summary || '').replace(/\s+/g, ' ').trim();
  const firstSent = summary.split(/[。．.]/).filter(Boolean)[0] || '';
  const insight = (a.key_insights || [])[0] || '';

  // Build response per agent persona
  let text;
  switch(agent){
    case 'cio':
      text = firstSent
        ? `綜合來看，${firstSent}。目前 verdict: ${verdict}，regime: ${regime}。`
        : `綜合各 desk 意見，verdict 維持 ${verdict}。regime: ${regime}。`;
      break;
    case 'pm':
      text = insight
        ? `從配置角度看，${insight}。`
        : `Portfolio 觀點: ${verdict}。${firstSent}`.trim();
      break;
    case 'da':
      const risk = (a.risk_flags || [])[0] || (a.counter_argument) || '';
      text = risk ? `風險上要注意: ${risk}` : `從風控觀點: ${verdict}。${firstSent}`.trim();
      break;
    case 'tm':
      text = pick.code && pick.code !== '—'
        ? `今日盤面候選: ${pick.name}(${pick.code}), entry ${pick.entry_zone}, stop ${pick.stop_loss}, target ${pick.target}。`
        : firstSent || '盤面短線觀察中，無強烈訊號。';
      break;
    case 'tw':
      text = insight ? `${insight}` : (firstSent || '台股短線觀察中。');
      break;
    case 'wm':
      text = insight ? `流動性面: ${insight}` : (firstSent || '財富面尚屬穩定。');
      break;
    default:
      text = firstSent || verdict;
  }

  // Build citations
  const cites = [];
  if(code) cites.push(`${agent.toUpperCase()}·${code}`);
  cites.push(`${agent.toUpperCase()}·VERDICT`);

  return { text, cites };
}

function chunkText(text, n){
  const out = [];
  for(let i = 0; i < text.length; i += n) out.push(text.slice(i, i + n));
  return out;
}

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

// ═══ Trigger: ⌘K / Ctrl-K + ESC ═══
document.addEventListener('keydown', (e) => {
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    toggleCounsel();
  } else if(e.key === 'Escape' && counselOpen()){
    closeCounsel();
  }
});

// ═══ Citation chip click → expand the agent's room ═══
document.addEventListener('click', (e) => {
  const chip = e.target.closest && e.target.closest('.cite');
  if(!chip) return;
  const ref = chip.dataset.cite || '';
  const [agentUC] = ref.split('·');
  const agent = (agentUC || '').toLowerCase();
  const card = (typeof AGENT_CARDS !== 'undefined') ? AGENT_CARDS[agent] : null;
  if(!card || !card.room) return;
  minimizeCounsel();
  // Defer expand so the minimize transition can run first
  setTimeout(() => expandRoom(card.room), 220);
