name: 每日投資 AI 分析

on:
  workflow_dispatch:   # 由 cron-job.org 觸發，不使用 GitHub 內建 cron

permissions:
  contents: write
  pages: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: python fetch_market_data.py
        env:
          PYTHONUNBUFFERED: "1"
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}

      - name: Run stock scanner
        run: python scanner.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Run investment agents
        run: python run_agents.py
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          # Optional second key (round-robin to double free-tier 20 RPD → 40 RPD).
          # Set this secret in repo settings if/when you have a second key.
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          PYTHONUNBUFFERED: "1"

      - name: Commit and push analysis
        run: |
          git config user.name  "Investment AI Bot"
          git config user.email "bot@investment-ai.local"
          git add data/analysis.json data/market_data.json data/candidate_stocks.json data/alpha.db data/agent_cache.json data/signal_vector.json
          # New persistent artefacts (prompt cache hits across runs; error log for frontend DATA HEALTH;
          # signal_history.jsonl for 30-day trend sparklines in SIGNAL MATRIX)
          [ -f data/llm_cache.json ] && git add data/llm_cache.json || true
          [ -f data/errors.log ] && git add data/errors.log || true
          [ -f data/signal_history.jsonl ] && git add data/signal_history.jsonl || true
          [ -f data/tw_stock_names.json ] && git add data/tw_stock_names.json || true
          git diff --staged --quiet || git commit -m "chore: update analysis $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M')"
          git push

      - name: Trigger GitHub Pages rebuild
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ianian22493/investment-ai/pages/builds"
