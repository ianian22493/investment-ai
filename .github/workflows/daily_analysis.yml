name: 每日投資 AI 分析

on:
  workflow_dispatch:   # 主力：由 cron-job.org 觸發
  schedule:
    # 備援：GitHub 內建 cron。cron-job.org 掛掉時由這裡補跑。
    # 若 cron-job.org 當天已跑（repo 已有今日 analysis commit），下方
    # skip-check 的 backup-cron guard 會自動略過 → 不重跑、不重複燒 Gemini 額度。
    - cron: '0 10 * * *'   # UTC 10:00 = 台灣 18:00（收盤後，晚 cron-job.org 約 90 分）
    - cron: '0 12 * * *'   # UTC 12:00 = 台灣 20:00（第二層備援）

permissions:
  contents: write
  pages: write

# 備援與主力若時間撞在一起：排隊執行、不並跑，避免兩個 run 同時 git push 相撞。
concurrency:
  group: daily-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50   # backup-cron guard 要用 git log --grep 找「今日是否已跑過」

      # ── Skip weekends + Fri PM + Sun AM + TW holidays ──────────────────
      # Post-market cron produces the NEXT trading day's pick, so we only
      # need to run when a next-day exists worth targeting:
      #   Sun 16:30 → Mon pick   Mon-Thu 16:30 → Tue-Fri pick
      # Fri 16:30 would be for Monday (3-day gap, stale by then) — Sun
      # refreshes it anyway. Sat and Sun-morning have no useful new data.
      # Also skip TW national holidays (春節/雙十/etc) — market closed,
      # yfinance returns stale data, analysis meaningless.
      # cron-job.org still pings us daily; this gate quietly exits when
      # we shouldn't do work. See CLAUDE.md for schedule doc.
      - name: Skip check (weekend / Fri PM / Sun AM / TW holiday)
        id: skip
        run: |
          DOW=$(TZ='Asia/Taipei' date +%u)   # 1=Mon .. 7=Sun
          HR=$(TZ='Asia/Taipei' date +%H)
          DATE=$(TZ='Asia/Taipei' date +%Y-%m-%d)
          echo "Taipei $(TZ='Asia/Taipei' date '+%a %H:%M') · DOW=$DOW HR=$HR DATE=$DATE"

          # ── Backup-cron guard（盯真正的產出：次日 pick 頁，不是「今天有無 commit」）──
          # 主力 = cron-job.org（workflow_dispatch）；GitHub 內建 cron 只是備援，
          # 兩者的盤後 run 任務都是「產生次一交易日的 pick 頁」。早盤資料 run 也會
          # commit 但『不』產生次日 pick，故不能用「今天有無 analysis commit」判斷
          # 盤後跑了沒。改看已發布的 picks/latest.json 日期：
          #   已 > 今天 ＝ 盤後那次已成功（次日 pick 出爐）→ 備援略過，不重燒 Gemini。
          #   ≤ 今天    ＝ 盤後尚未成功（含盤後 run 失敗、早盤只 commit 資料）→ 接手補跑。
          # 只對 schedule 啟用；workflow_dispatch（主力）永遠照跑。python3 已由下方
          # holiday check 證實在 setup-python 前即可用（ubuntu-latest 內建）。
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PICKDATE=$(python3 -c "import json;print(json.load(open('picks/latest.json',encoding='utf-8')).get('date',''))" 2>/dev/null || echo "")
            if [ -n "$PICKDATE" ] && [[ "$PICKDATE" > "$DATE" ]]; then
              echo "次日 pick（$PICKDATE）已發布 > 今天($DATE) — 盤後那次已成功，備援略過"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "尚無次日 pick（latest=$PICKDATE、今天=$DATE）— 備援接手補跑"
          fi

          # TW holiday check — data/tw_holidays.json is the source of truth.
          # A date under "holidays" (and not under "special_trading_days")
          # means market closed → skip the whole run.
          if [ -f data/tw_holidays.json ]; then
            if python3 -c "
          import json, sys
          d = json.load(open('data/tw_holidays.json', encoding='utf-8'))
          target = '$DATE'
          hols = set()
          for y in d.get('holidays', {}).values(): hols.update(y)
          special = set()
          for y in d.get('special_trading_days', {}).values():
              if isinstance(y, list): special.update(y)
          sys.exit(0 if (target in hols and target not in special) else 1)
          "; then
              echo "TW holiday $DATE — skip entire run"
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi

          if [ "$DOW" = "6" ]; then
            echo "Saturday — skip entire run"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$DOW" = "7" ] && [ "$HR" -lt 13 ]; then
            echo "Sunday morning — skip (no market data to refresh)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$DOW" = "5" ] && [ "$HR" -ge 13 ]; then
            echo "Friday afternoon — skip (Sun will produce Mon pick)"
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.skip.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.skip.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Smoke tests
        if: steps.skip.outputs.skip != 'true'
        # Soft gate — failure is reported but doesn't block the analysis
        # pipeline (we'd rather have today's analysis with a noisy smoke
        # log than no analysis at all). Watch the Actions tab for ✗ marks.
        continue-on-error: true
        run: python -m tests.smoke
        env:
          PYTHONUNBUFFERED: "1"
          # Stub key satisfies agents/base.py import; the smoke tests
          # don't actually call Gemini. Real key still flows via
          # secrets.GEMINI_API_KEY to the "Run investment agents" step.
          GEMINI_API_KEY: "smoke-stub-not-real"

      - name: Fetch market data
        if: steps.skip.outputs.skip != 'true'
        run: python fetch_market_data.py
        env:
          PYTHONUNBUFFERED: "1"
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}

      - name: Run stock scanner
        if: steps.skip.outputs.skip != 'true'
        run: python scanner.py
        env:
          PYTHONUNBUFFERED: "1"

      # 補抓當月月營收（寶藏面板即時化）——只在 history 批次落後「今天該有的月」時
      # 才 fetch。月營收一個月才變一次，故真正抓取每月只一次；其餘日子只做目錄
      # 比對、不 fetch。純資料、非致命，故 continue-on-error。排在寶藏哨兵之前，
      # 讓 rev_momentum/面板讀到的是最新月，不再慢一個月。
      - name: Refresh current-month revenue
        if: steps.skip.outputs.skip != 'true'
        run: python screener/refresh_revenue.py
        env:
          PYTHONUNBUFFERED: "1"
        continue-on-error: true

      # S0 領先訊號①：抓全市場大戶%、存「高毛利低基期」宇宙快照（dedupe by TDCC 週日期
      # ＝冪等，天天跑也只每週增一筆）。跨 run 累積 → 約5週後「大戶籌碼累積趨勢」成熟＝
      # 聰明錢在財報動之前先卡位的資料訊號（月排程 tw-s0-catalyst-scan 讀它）。純資料非致命。
      - name: S0 cap-scan snapshot (smart-money x low-base)
        if: steps.skip.outputs.skip != 'true'
        run: python screener/s0_capscan.py --snapshot
        env:
          PYTHONUNBUFFERED: "1"
        continue-on-error: true

      # ── 主菜(寶藏雷達)先落地，再跑實驗性副菜(AI波段) ──────────────────
      # 寶藏哨兵是純價格/資料(不吃 LLM)，排在 run_agents 之前，確保寶藏
      # 入場區/alerts/價格先寫好；下游 AI 波段步驟就算失敗也不影響它。
      # 哨兵寫 data/alerts.json（含 zone 到價）→ generate.py 隨後讀它，
      # 把「⭐ 寶藏觀察名單·到入場區」放進當天 pick 頁（2026-08-06 連動 #4）。
      - name: Watchlist watcher (price/panic alerts)
        if: steps.skip.outputs.skip != 'true'
        # 寶藏股哨兵：檢查 data/watchlist.json 的價格/指數觸發，
        # 新觸發推 Discord（DISCORD_WEBHOOK_URL 未設定則僅寫 data/alerts.json）。
        # 純 yfinance 價格檢查，不用 LLM quota。
        run: python screener/watchlist_watcher.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONUNBUFFERED: "1"
        continue-on-error: true   # 哨兵故障不影響主分析

      # 波段/AI 副菜：run_agents 吃 Gemini。加 continue-on-error＝它掛掉
      # （額度爆/LLM 錯）也不 abort 整條——上游寶藏雷達已落地，下游
      # generate/commit 照跑（產出觀望日頁＋寶藏面板）。主菜不再被試用期
      # 副菜(C1)當人質；哪天要收掉波段，停用這一步即可、不牽動寶藏系統。
      - name: Run investment agents
        if: steps.skip.outputs.skip != 'true'
        run: python run_agents.py
        continue-on-error: true
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          # Optional second key (round-robin to double free-tier 20 RPD → 40 RPD).
          # Set this secret in repo settings if/when you have a second key.
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          PYTHONUNBUFFERED: "1"

      - name: Generate daily pick page
        if: steps.skip.outputs.skip != 'true'
        # Only runs after Phase 4 produced tw_daily_pick. generate.py skips
        # itself if no pick data exists (pre-market run). 讀哨兵剛寫的 alerts.json。
        run: python picks/generate.py
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          PYTHONUNBUFFERED: "1"
        continue-on-error: true   # pick page is non-critical; analysis still commits even if this breaks

      - name: Portfolio gap lens (組合缺口/分散透鏡)
        if: steps.skip.outputs.skip != 'true'
        # 算整個組合的因子/地區曝險，標過度集中與缺口 → data/portfolio_gap.json。
        # 系統唯一「對抗集中」的工具；給組合缺口分散掃描當第一層。純 stdlib，不吃 quota。
        run: python screener/portfolio_gap.py
        env:
          PYTHONUNBUFFERED: "1"
        continue-on-error: true

      - name: Commit and push analysis
        if: steps.skip.outputs.skip != 'true'
        run: |
          git config user.name  "Investment AI Bot"
          git config user.email "bot@investment-ai.local"
          git add data/analysis.json data/market_data.json data/candidate_stocks.json data/alpha.db data/agent_cache.json data/signal_vector.json
          # New persistent artefacts (prompt cache hits across runs; error log for frontend DATA HEALTH;
          # signal_history.jsonl for 30-day trend sparklines in SIGNAL MATRIX)
          [ -f data/llm_cache.json ] && git add data/llm_cache.json || true
          [ -f data/errors.log ] && git add data/errors.log || true
          [ -f data/signal_history.jsonl ] && git add data/signal_history.jsonl || true
          [ -f data/tw_stock_names.json ] && git add data/tw_stock_names.json || true
          # Swing scorecard — 寶藏股研究室季度審判日抓的成績單（連動 #4）
          [ -f data/swing_scorecard.json ] && git add data/swing_scorecard.json || true
          # 恐慌日紀錄 — 冷卻期 gate 的依據（改進 #2）
          [ -f data/panic_log.json ] && git add data/panic_log.json || true
          [ -f data/alerts.json ] && git add data/alerts.json || true
          [ -f data/portfolio_gap.json ] && git add data/portfolio_gap.json || true
          # 大戶籌碼快取（TDCC 集保，哨兵每週自動 refresh；提交才能跨 run 累積趨勢）
          [ -f data/chip/latest.json ] && git add data/chip/latest.json data/chip/history.json || true
          # S0 低基期宇宙的大戶%週快照（跨 run 累積＝S0 籌碼累積趨勢的記憶體）
          [ -f data/chip/s0_history.json ] && git add data/chip/s0_history.json || true
          # S0 宇宙的資產負債表季快照（④capex先行 非流動資產QoQ、⑤庫藏股% QoQ）
          [ -f data/screener/bs_history.json ] && git add data/screener/bs_history.json || true
          # 補抓的當月月營收（refresh_revenue 寫的 rev_YYYMM.json）——寶藏面板即時化
          git add data/screener/history 2>/dev/null || true
          # Daily pick page (generated by picks/generate.py) — picks/*.html
          # changes only on post-market runs; pre-market runs no-op so nothing to add.
          # picks/latest.json is the "most recent existing pick" pointer that
          # the hub reads — must be committed or the hub stays frozen on an old date.
          git add picks/*.html picks/latest.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update analysis $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M')"
          # Push with retry — if remote moved during this 5-min cron run
          # (e.g. user pushed a fix), pull --rebase and push again.
          # Loop 3 times to handle the rare case where remote keeps moving.
          for attempt in 1 2 3; do
            if git push 2>&1; then
              echo "✓ Push succeeded on attempt $attempt"
              break
            fi
            echo "Push attempt $attempt rejected — rebasing on origin/main and retrying..."
            git pull --rebase --autostash --no-edit origin main || {
              echo "✗ Rebase failed (conflict?); aborting"
              git rebase --abort 2>/dev/null || true
              exit 1
            }
            if [ "$attempt" = "3" ]; then
              echo "✗ Push failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

      - name: Trigger GitHub Pages rebuild
        if: steps.skip.outputs.skip != 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ianian22493/investment-ai/pages/builds"

      # ─ Optional: Discord notification on failure ──────────────────────────
      # Set up: create a webhook in your Discord server (Settings → Integrations
      # → Webhooks → New Webhook), copy URL, add as DISCORD_WEBHOOK_URL secret.
      # If not configured, this step is silently skipped.
      - name: Discord — notify on failure
        if: failure() && env.WEBHOOK != ''
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -s -H "Content-Type: application/json" -X POST "$WEBHOOK" -d @- <<EOF
          {
            "username": "Investment AI",
            "embeds": [{
              "title": "❌ Daily analysis failed",
              "description": "Run ${GITHUB_RUN_NUMBER} on \`${GITHUB_REF_NAME}\` failed at $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M').",
              "url": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
              "color": 15158332
            }]
          }
          EOF
