name: 每日投資 AI 分析

on:
  schedule:
    # 台灣時間：09:10 開盤 (01:10 UTC)、13:35 收盤後 (05:35 UTC)，週一至週五
    - cron: "10 1 * * 1-5"
    - cron: "35 5 * * 1-5"
  workflow_dispatch:   # 允許手動觸發

permissions:
  contents: write
  pages: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: python fetch_market_data.py
        env:
          PYTHONUNBUFFERED: "1"
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}

      - name: Run stock scanner
        run: python scanner.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Run investment agents
        run: python run_agents.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"

      - name: Commit and push analysis
        run: |
          git config user.name  "Investment AI Bot"
          git config user.email "bot@investment-ai.local"
          git add data/analysis.json data/market_data.json data/candidate_stocks.json data/alpha.db data/agent_cache.json
          git diff --staged --quiet || git commit -m "chore: update analysis $(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M')"
          git push

      - name: Trigger GitHub Pages rebuild
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ianian22493/investment-ai/pages/builds"
