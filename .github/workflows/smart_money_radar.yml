name: 聰明錢訊號雷達

# 每月 18 日執行（13F 於季末後 45 天內申報：2/14、5/15、8/14、11/14 前後，
# 18 日跑確保新一季資料已到齊）。純 stdlib、無 LLM、不吃 Gemini quota。
# 主力用 cron-job.org 觸發；GH 內建 cron 兩道備援錯開。腳本冪等。
on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 17 * *'   # UTC 17日16:30 = 台灣 18日 00:30
    - cron: '30 22 17 * *'   # UTC 17日22:30 = 台灣 18日 06:30

permissions:
  contents: write
  pages: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run smart-money radar
        run: python screener/smart_money_radar.py
      - name: Commit & push (rebase retry ×3)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/smart_money/
          git diff --staged --quiet || git commit -m "chore: smart-money radar $(TZ='Asia/Taipei' date '+%Y-%m')"
          for a in 1 2 3; do
            git push 2>&1 && { echo "pushed on $a"; break; }
            git pull --rebase --autostash --no-edit origin main || { git rebase --abort 2>/dev/null||true; exit 1; }
            [ "$a" = 3 ] && { echo "push failed x3"; exit 1; }
            sleep 5
          done
      - name: Trigger Pages rebuild
        run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ianian22493/investment-ai/pages/builds"
