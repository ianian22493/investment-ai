name: 月度寶藏股篩選器

# 每月 11 日凌晨（台灣時間）執行 — 月營收於 10 日申報截止，11 日資料最全。
# 主力觸發：cron-job.org（workflow_dispatch）；GitHub 內建 cron 為備援，
# 排兩道錯開（GH cron 有延遲/漏跑風險）。腳本冪等，重複執行只會覆寫同月檔案。
on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 10 * *'   # UTC 10日16:30 = 台灣 11日 00:30（備援一）
    - cron: '30 22 10 * *'   # UTC 10日22:30 = 台灣 11日 06:30（備援二）

permissions:
  contents: write
  pages: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 純 stdlib，無需 pip install；不用 LLM、不吃 Gemini quota
      - name: Run screener
        run: python screener/monthly_screener.py

      - name: Commit & push (rebase retry ×3)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener/
          git diff --staged --quiet || git commit -m "chore: monthly screener $(TZ='Asia/Taipei' date '+%Y-%m')"
          for attempt in 1 2 3; do
            if git push 2>&1; then
              echo "✓ Push succeeded on attempt $attempt"
              break
            fi
            echo "Push attempt $attempt rejected — rebasing and retrying..."
            git pull --rebase --autostash --no-edit origin main || {
              echo "✗ Rebase failed (conflict?); aborting"
              git rebase --abort 2>/dev/null || true
              exit 1
            }
            if [ "$attempt" = "3" ]; then
              echo "✗ Push failed after 3 attempts"
              exit 1
            fi
            sleep 5
          done

      - name: Trigger GitHub Pages rebuild
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ianian22493/investment-ai/pages/builds"
